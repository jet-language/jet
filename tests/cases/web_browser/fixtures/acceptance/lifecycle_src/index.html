<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>jet dom lifecycle</title>
<style>
  body { margin: 24px; font: 15px system-ui, sans-serif; }
  #jet-app { position: relative; min-height: 40px; }
</style>
</head>
<body>
<div id="jet-app"></div>
<button id="hide" type="button">hide</button>
<button id="show" type="button">show</button>
<script type="module">
import { render } from "./app.js";
render(true);
document.getElementById("hide").addEventListener("click", () => render(false));
document.getElementById("show").addEventListener("click", () => render(true));
</script>
</body>
</html>
