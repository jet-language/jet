# jetpack.toml — source defaults (D-JPK-FILES, ratified 2026-06-18).
#
# Place this file at the repo root. It declares:
#   [repo]     — identity of this monorepo
#   [sources]  — named package sources (target@provider refs or bare paths)
#
# jetpack reads this before resolving any refs in env.jet.

[repo]
name = "jet-example-repo"
version = "0.1.0"

[sources]
# Named source refs used in env.jet and package.jet deps.
# Format: name = "target@provider" or a bare local path
mine = "./jet-pkgs"
stable = "NixOS/nixpkgs/nixos-24.05@github"
unstable = "NixOS/nixpkgs/nixpkgs-unstable@github"
