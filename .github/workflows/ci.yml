# Hosted CI runs the Core surface ledger and CoreCall registry checks, which
# need the committed Tower board. The native compiler check, the Core
# source-coverage ratchet (Tools/agent/CoreCoverage.jet) and the full gate suite
# run locally through Tools/agent/LaneCheck.jet and Tools/agent/VerifyFull.jet
# until a pinned native seed release exists (D-SEED-DIST1).
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Core surface ledger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Core surface ledger and Core views are current
        run: |
          jet Tools/agent/CoreSurfaceLedger.jet --check
