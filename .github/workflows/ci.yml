name: CI

# D-CI1=A: the complete cargo test-target inventory, sharded, on every push
# (flags red). Nightly lane adds rotating-seed fuzzing (N>=1000) and perf
# ratchet. c730 adds the named JIT/AOT parity job.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  cffi-native-matrix:
    name: C ABI native (linux-x64)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Required native C ABI proof
        env:
          JET_CFFI_MATRIX_REQUIRED: "1"
          JET_CFFI_CC: clang
          JET_CFFI_AR: llvm-ar
          JET_CFFI_RUSTC: rustc
          JET_CFFI_ABI: sysv64
        run: cargo test --test cffi_native_matrix -- --nocapture

  cffi-native-aarch64:
    name: C ABI native (linux-aarch64-qemu)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
      - name: Required aarch64 C ABI proof
        env:
          JET_CFFI_MATRIX_REQUIRED: "1"
          JET_CFFI_CC: aarch64-linux-gnu-gcc
          JET_CFFI_AR: aarch64-linux-gnu-ar
          JET_CFFI_RUSTC: rustc
          JET_CFFI_RUST_TARGET: aarch64-unknown-linux-gnu
          JET_CFFI_RUST_LINKER: aarch64-linux-gnu-gcc
          JET_CFFI_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
          JET_CFFI_ABI: default
        run: cargo test --test cffi_native_matrix -- --nocapture

  jetpack-platform:
    name: Jetpack platform audit (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # These suites need the devshell toolchain, exactly as they do locally.
      # Nix has no Windows runner, so the Windows rows use native tooling.
      - name: Install Nix
        if: matrix.os != 'windows-latest'
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Windows core.path normalization runtime proof
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --test path_durability -- --nocapture

      - name: Platform audit (Unix)
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        run: nix develop .#full -c cargo test --test jetpack_platform

      - name: Platform audit (Windows)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --test jetpack_platform

      - name: Native core.os facts and interrupt lifecycle (Unix)
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        run: nix develop .#full -c cargo test --test os_native -- --nocapture

      - name: Native core.os facts and interrupt lifecycle (Windows)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --test os_native -- --nocapture

      - name: Windows core.os Ctrl-C runtime proof
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --test os_interrupt_windows -- --nocapture

      - name: Windows native IOCP scheduler proof
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: |
          cargo test -p jet-codegen iocp_wake_cancel_deadline_stale_scale_and_cleanup -- --nocapture
          cargo test --test scheduler_native -- --nocapture

  # D-PLATFORM-EVIDENCE1=D: a criterion that names a platform closes per
  # platform row, and only a job that actually exercises that platform's
  # behaviour counts. The generic host jobs above deliberately do NOT close
  # these rows: a Windows runner that never touches ConPTY proves nothing
  # about ConPTY. Each step below is the matching evidence for one named row.
  native-session-matrix:
    name: Native sessions and sandbox (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The sandbox and PTY backends come from the devshell, exactly as they
      # do locally: build_sandbox fails on a bare host because bubblewrap is
      # absent, not because containment is broken. Nix is unavailable on the
      # Windows runner, so that row runs native tooling directly.
      - name: Install Nix
        if: matrix.os != 'windows-latest'
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Card #1186 rows: native PTY fixtures on every supported platform.
      # Every row below uses `!cancelled()` so one red row still reports the
      # others; a skipped step is not evidence either way.
      - name: Process sessions native fixtures (Unix)
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        run: nix develop .#full -c cargo test --test process_sessions -- --nocapture

      - name: Process sessions native fixtures (Windows)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --test process_sessions -- --nocapture

      # Card #1182 row: ConPTY is Windows-only, so only this row can close it.
      # The test lives in tests/corelib_parts/platform.rs, reached through the
      # corelib_platform target — process_sessions has no conpty test at all.
      - name: Windows ConPTY session backend
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --test corelib_platform core_process_terminal_uses_windows_conpty_for_bytes_resize_and_close -- --nocapture

      # Card #891 row: AppContainer isolation is a Windows facility.
      - name: Windows AppContainer build sandbox isolation
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --test build_sandbox -- --nocapture

      # Card #891 rows: the Unix sandbox path on its own platforms.
      - name: Unix build sandbox isolation
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        run: nix develop .#full -c cargo test --test build_sandbox -- --nocapture

      # Card #1173 rows: the agent corpus on its frozen OS matrix. The corpus
      # doc excludes Windows at docs/audits/agent-workload-corpus.md:61, so
      # that row needs an owner exclusion with an expiry, not a job.
      - name: Agent workload corpus
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        run: nix develop .#full -c cargo test --test agent_workloads -- --nocapture

  # c730: named strict JIT↔AOT parity job. Matrix = every host where native
  # Cranelift JIT is supported today (x86_64 only). aarch64 / Apple Silicon /
  # Windows ARM leave the matrix with named reason in the report artifact
  # (cranelift_host_supported is x86_64-only).
  jit-aot-parity:
    name: JIT/AOT parity (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-13
            label: macos-x86_64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strict JIT/AOT differential gate (#727)
        shell: bash
        env:
          JET_REQUIRE_RUSTC: "1"
          JET_REQUIRE_CRANELIFT_HOST: "1"
          JET_CORPUS_GATE_REPORT_DIR: ${{ github.workspace }}/jit-aot-parity-report
        run: bash tools/ci/jit-aot-parity.sh

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jit-aot-parity-${{ matrix.label }}-${{ github.sha }}
          path: jit-aot-parity-report/
          retention-days: 30
          if-no-files-found: error

  verify:
    name: Verify checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check

      - name: Cargo check
        run: nix develop -c cargo check

      - name: Install aarch64 cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: aarch64 freestanding QEMU smoke
        run: nix develop .#full -c bash tools/ci/aarch64-qemu-freestanding.sh

  # D-WASISRV1=A: the server example is a real WASI Preview 2 Component.
  # Build it with the target toolchain, then grant wasmtime TCP access and
  # prove one request reaches the Jet HTTP Prelude.
  wasip2-server:
    name: WASI Preview 2 server
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install WASI Preview 2 target
        run: nix develop .#full -c rustup toolchain install stable --target wasm32-wasip2

      - name: Build Jet
        run: nix develop .#full -c cargo build

      - name: Build and serve WASI Component
        run: |
          nix develop .#full -c bash -euo pipefail -c '
            export PATH="$(dirname "$(rustup which rustc --toolchain stable)"):$PATH"
            ./target/debug/jet build \
              examples/features/net/http_server_wasip2.jet \
              --target=wasm32-wasip2
            wasm-tools validate build/http_server_wasip2
            wasmtime run -S inherit-network=y -S tcp=y build/http_server_wasip2 >wasip2-server.log 2>&1 &
            server_pid=$!
            trap "kill $server_pid 2>/dev/null || true" EXIT
            for _ in $(seq 1 30); do
              grep -q "true" wasip2-server.log && break
              sleep 1
            done
            grep -q "true" wasip2-server.log
            curl --fail --silent --max-time 5 http://127.0.0.1:18080/ | grep -Fx "hello from wasip2"
          '

  # #211 (D-CI1=A): the complete cargo test-target inventory (every lib/bin/
  # test target `cargo metadata` names across the whole workspace — not just
  # the "."/jet-driver/jetpack-bin/jetos default-members plain `cargo test`
  # silently limited itself to), sharded across parallel jobs so PR wall-clock
  # stays sane as the suite grows. tools/ci/test-shards.sh enumerates targets
  # fresh every run, so a newly added test file always lands in some shard —
  # it can never silently fall out of the gate the way default-members did.
  # tests/release_gates.rs proves shard_count here matches SHARD_COUNT below
  # and that the shards' union is the exact `cargo metadata` inventory.
  verify-tests:
    name: Verify tests (shard ${{ matrix.shard }}/6)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      JET_REQUIRE_RUSTC: "1"
      JET_TEST_SHARD: ${{ matrix.shard }}
      JET_TEST_SHARD_COUNT: "6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify suite shard (D-CI1)
        run: nix develop .#full -c scripts/agent/verify-full.sh

  nightly-fuzz:
    name: Nightly rotating-seed fuzz + perf ratchet
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Rotating-seed sema fuzz (N=1000)
        env:
          JET_REQUIRE_RUSTC: "1"
          FUZZ_VARIANTS: "1000"
        run: |
          seed="$(date -u +%Y%m%d)"
          echo "nightly fuzz seed: $seed"
          FUZZ_SEED="$seed" nix develop -c cargo test --release --test fuzz_sema -- --nocapture

      - name: Perf ratchet
        run: nix develop -c sh tools/perf/ci-perf-check.sh
