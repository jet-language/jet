# Hosted CI checks compilation and the cheap source-coverage ratchet. The full
# gate suite runs locally through Tools/agent/verify-full.sh.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Core source coverage ratchet
        run: |
          node --test Tools/agent/core-coverage-census.test.mjs
          node Tools/agent/core-coverage-census.mjs --check
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cargo check
        run: nix develop .#full -c cargo check --workspace --all-targets --locked
