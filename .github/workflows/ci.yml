# Hosted CI runs the cheap source-coverage ratchet. The native compiler check
# and the full gate suite run locally through Tools/agent/lane-check.sh and
# Tools/agent/verify-full.sh until a pinned native seed release exists
# (D-SEED-DIST1).
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Core source coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Core source coverage ratchet
        run: |
          node --test Tools/agent/core-coverage-census.test.mjs
          node Tools/agent/core-coverage-census.mjs --check
