name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  jetpack-platform:
    name: Jetpack platform audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Platform audit
        run: cargo test --test jetpack_platform

  nix:
    name: Nix toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Show Tower status
        run: nix develop -c node tools/Tower/Tower.mjs status

      - name: Check flake
        run: nix flake check

      - name: Cargo check
        run: nix develop -c cargo check

      - name: Unit tests
        run: nix develop -c cargo test --lib

      - name: Truthfulness checks
        run: nix develop -c cargo test --test truthfulness

      - name: Diagnostic snapshots
        run: nix develop -c cargo test --test diagnostic_snapshots

      - name: Golden examples
        run: nix develop -c cargo test --test golden

      - name: Freestanding / cross-target tests
        run: nix develop -c cargo test --test cross

      - name: Install aarch64 cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: aarch64 freestanding QEMU smoke
        run: nix develop -c bash tools/ci/aarch64-qemu-freestanding.sh
