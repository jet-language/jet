# Minimal CI: prove the workspace compiles. The full gate suite runs locally
# through Tools/agent/verify-full.sh until the hosted lanes are reinstated.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cargo check
        run: nix develop .#full -c cargo check --workspace --all-targets --locked
