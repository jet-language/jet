name: CI

# D-CI3=A: full suite on every push (flags red, never blocks — no branch
# protection changes here). Nightly lane adds rotating-seed fuzzing
# (N>=1000) and the perf ratchet.
on:
  push:
  pull_request:
  schedule:
    # Nightly fuzz + perf ratchet lane, 03:00 UTC.
    - cron: "0 3 * * *"

jobs:
  jetpack-platform:
    name: Jetpack platform audit (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Platform audit
        run: cargo test --test jetpack_platform

      - name: Native core.os facts and interrupt lifecycle
        run: cargo test --test os_native -- --nocapture

      - name: Windows core.os Ctrl-C runtime proof
        if: matrix.os == 'windows-latest'
        run: cargo test --test os_interrupt_windows -- --nocapture

      - name: Windows core.path normalization runtime proof
        if: matrix.os == 'windows-latest'
        run: cargo test --test path_durability -- --nocapture

      - name: Windows native IOCP scheduler proof
        if: matrix.os == 'windows-latest'
        run: |
          cargo test -p jet-codegen iocp_wake_cancel_deadline_stale_scale_and_cleanup -- --nocapture
          cargo test --test scheduler_native -- --nocapture

  verify:
    name: Full verify suite
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check

      - name: Cargo check
        run: nix develop -c cargo check

      - name: Full verify suite (D-CI3)
        env:
          JET_REQUIRE_RUSTC: "1"
        run: nix develop -c scripts/agent/verify-full.sh

      - name: Install aarch64 cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: aarch64 freestanding QEMU smoke
        run: nix develop -c bash tools/ci/aarch64-qemu-freestanding.sh

  nightly-fuzz:
    name: Nightly rotating-seed fuzz + perf ratchet
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Rotating-seed sema fuzz (N=1000)
        env:
          JET_REQUIRE_RUSTC: "1"
          FUZZ_VARIANTS: "1000"
        run: |
          seed="$(date -u +%Y%m%d)"
          echo "nightly fuzz seed: $seed"
          FUZZ_SEED="$seed" nix develop -c cargo test --release --test fuzz_sema -- --nocapture

      - name: Perf ratchet
        run: nix develop -c sh tools/perf/ci-perf-check.sh
