name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  nix:
    name: Nix toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Show Tower status
        run: nix develop -c node tools/Tower/Tower.mjs status

      - name: Check flake
        run: nix flake check

      - name: Cargo check
        run: nix develop -c cargo check

      - name: Unit tests
        run: nix develop -c cargo test --lib

      - name: Truthfulness checks
        run: nix develop -c cargo test --test truthfulness

      - name: UI snapshots
        run: nix develop -c cargo test --test ui

      - name: Golden examples
        run: nix develop -c cargo test --test golden

      - name: Freestanding / cross-target tests
        run: nix develop -c cargo test --test cross
