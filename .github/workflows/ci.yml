name: CI

# D-CI1=A: the complete cargo test-target inventory, sharded, on every push
# (flags red). Nightly lane adds rotating-seed fuzzing (N>=1000) and perf
# ratchet. c730 adds the named JIT/AOT parity job.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  cffi-native-matrix:
    name: C ABI native (linux-x64)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Required native C ABI proof
        env:
          JET_CFFI_MATRIX_REQUIRED: "1"
          JET_CFFI_CC: clang
          JET_CFFI_AR: llvm-ar
          JET_CFFI_RUSTC: rustc
          JET_CFFI_ABI: sysv64
        run: cargo test --test cffi_native_matrix -- --nocapture

  cffi-native-aarch64:
    name: C ABI native (linux-aarch64-qemu)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
      - name: Required aarch64 C ABI proof
        env:
          JET_CFFI_MATRIX_REQUIRED: "1"
          JET_CFFI_CC: aarch64-linux-gnu-gcc
          JET_CFFI_AR: aarch64-linux-gnu-ar
          JET_CFFI_RUSTC: rustc
          JET_CFFI_RUST_TARGET: aarch64-unknown-linux-gnu
          JET_CFFI_RUST_LINKER: aarch64-linux-gnu-gcc
          JET_CFFI_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
          JET_CFFI_ABI: default
        run: cargo test --test cffi_native_matrix -- --nocapture

  jetpack-platform:
    name: Jetpack platform audit (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # These suites need the devshell toolchain, exactly as they do locally.
      # Nix has no Windows runner, so the Windows rows use native tooling.
      - name: Install Nix
        if: matrix.os != 'windows-latest'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Allow unprivileged user namespaces (bubblewrap sandbox)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Windows core.path normalization runtime proof
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --test path_durability -- --nocapture

      - name: Platform audit (Unix)
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        run: nix develop .#full -c cargo test --test jetpack_platform

      - name: Platform audit (Windows)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --test jetpack_platform

      - name: Native core.os facts and interrupt lifecycle (Unix)
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        run: nix develop .#full -c cargo test --test os_native -- --nocapture

      - name: Native core.os facts and interrupt lifecycle (Windows)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --test os_native -- --nocapture

      - name: Windows core.os Ctrl-C runtime proof
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --test os_interrupt_windows -- --nocapture

      - name: Windows native IOCP scheduler proof
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: |
          cargo test -p jet-codegen iocp_wake_cancel_deadline_stale_scale_and_cleanup -- --nocapture
          cargo test --test scheduler_native -- --nocapture

  # D-PLATFORM-EVIDENCE1=D: a criterion that names a platform closes per
  # platform row, and only a job that actually exercises that platform's
  # behaviour counts. The generic host jobs above deliberately do NOT close
  # these rows: a Windows runner that never touches ConPTY proves nothing
  # about ConPTY. Each step below is the matching evidence for one named row.
  native-session-matrix:
    name: Native sessions and sandbox (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The sandbox and PTY backends come from the devshell, exactly as they
      # do locally: build_sandbox fails on a bare host because bubblewrap is
      # absent, not because containment is broken. Nix is unavailable on the
      # Windows runner, so that row runs native tooling directly.
      - name: Install Nix
        if: matrix.os != 'windows-latest'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Allow unprivileged user namespaces (bubblewrap sandbox)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Card #1186 rows: native PTY fixtures on every supported platform.
      # Every row below uses `!cancelled()` so one red row still reports the
      # others; a skipped step is not evidence either way.
      - name: Process sessions native fixtures (Unix)
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        run: nix develop .#full -c cargo test --test process_sessions -- --nocapture

      - name: Process sessions native fixtures (Windows)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --test process_sessions -- --nocapture

      # Card #1182 row: ConPTY is Windows-only, so only this row can close it.
      # The test lives in tests/corelib_parts/platform.rs, reached through the
      # corelib_platform target — process_sessions has no conpty test at all.
      - name: Windows ConPTY session backend
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --test corelib_platform core_process_terminal_uses_windows_conpty_for_bytes_resize_and_close -- --nocapture

      # Card #891 row: AppContainer isolation is a Windows facility.
      - name: Windows AppContainer build sandbox isolation
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --test build_sandbox -- --nocapture

      # Card #891 rows: the Unix sandbox path on its own platforms.
      - name: Unix build sandbox isolation
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        run: nix develop .#full -c cargo test --test build_sandbox -- --nocapture

      # Card #1415 criterion 5: the script-to-system journey records its own
      # receipt per host. The current tests/suites.txt entry is
      # tests/script_to_system, so the native rows run it here rather than
      # re-hosting its #[test] inside another test binary -- doing that
      # double-included tests/common/mod.rs and broke the build with
      # "cannot define multiple global allocators".
      - name: Script-to-system journey (Unix)
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        run: nix develop .#full -c cargo test --test script_to_system -- --nocapture

      - name: Script-to-system journey (Windows)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --test script_to_system -- --nocapture

      # Card #1173 rows: the agent corpus on its frozen OS matrix. The corpus
      # doc excludes Windows at docs/audits/agent-workload-corpus.md:61 and
      # the exclusion is recorded with an expiry in native_os_matrix.tsv, so
      # the Windows row closes by that exclusion rather than by a job.
      - name: Agent workload corpus
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        run: nix develop .#full -c cargo test --test agent_workloads -- --nocapture

      # The gate scripts are the committed report/matrix checks. Running the
      # corpus suite alone left them unexercised in CI, so the generated
      # report path and the frozen OS matrix were never gated.
      - name: Agent workload gate (report + matrix)
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        run: |
          nix develop .#full -c bash tools/ci/agent-workload-gate.sh
          nix develop .#full -c bash tools/ci/agent-workload-matrix.sh

      - name: Agent workload gate self-check
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        run: nix develop .#full -c bash tools/ci/test-agent-workload-gate.sh

      # Card #1414: keep the hosted compiled-workload contract and all seven
      # validator removal canaries in CI. No measurement report is checked in;
      # a real report still requires clean-machine runs and fresh review.
      - name: Compiled workload gate (Unix)
        if: ${{ !cancelled() && matrix.os != 'windows-latest' }}
        run: |
          nix develop .#full -c bash tools/ci/compiled-workload-gate.sh --contract
          nix develop .#full -c bash tools/ci/test-compiled-workload-gate.sh

      - name: Compiled workload gate (Windows)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        shell: bash
        run: |
          bash tools/ci/compiled-workload-gate.sh --contract
          bash tools/ci/test-compiled-workload-gate.sh

  # c730: named strict JIT↔AOT parity job. Matrix = every host where native
  # Cranelift JIT is supported today (x86_64 only). aarch64 / Apple Silicon /
  # Windows ARM leave the matrix with named reason in the report artifact
  # (cranelift_host_supported is x86_64-only).
  jit-aot-parity:
    name: JIT/AOT parity (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-13
            label: macos-x86_64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strict JIT/AOT differential gate (#727)
        shell: bash
        env:
          JET_REQUIRE_RUSTC: "1"
          JET_REQUIRE_CRANELIFT_HOST: "1"
          JET_CORPUS_GATE_REPORT_DIR: ${{ github.workspace }}/jit-aot-parity-report
        run: bash tools/ci/jit-aot-parity.sh

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jit-aot-parity-${{ matrix.label }}-${{ github.sha }}
          path: jit-aot-parity-report/
          retention-days: 30
          if-no-files-found: error

  verify:
    name: Verify checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check

      - name: Cargo check
        run: nix develop .#full -c cargo check --workspace --all-targets --locked

      - name: Install aarch64 cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: aarch64 freestanding QEMU smoke
        run: nix develop .#full -c bash tools/ci/aarch64-qemu-freestanding.sh

  # D-CI1=A: grammar drift and the Rust documentation build are explicit
  # change-gate inputs. The direct grammar target must fail if tests/grammar.rs
  # is removed from the candidate, even when the broad test inventory changes.
  change-gate:
    name: Change gate (grammar + documentation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Grammar drift gate
        env:
          JET_REQUIRE_RUSTC: "1"
        run: nix develop .#full -c cargo test --test grammar --locked -- --nocapture

      - name: Documentation build gate
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: nix develop .#full -c cargo doc --workspace --no-deps --locked

  # D-WASISRV1=A: the server example is a real WASI Preview 2 Component.
  # Build it with the target toolchain, then grant wasmtime TCP access and
  # prove one request reaches the Jet HTTP Prelude.
  wasip2-server:
    name: WASI Preview 2 server
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install WASI Preview 2 target
        run: nix develop .#full -c rustup toolchain install stable --target wasm32-wasip2

      - name: Build Jet
        run: nix develop .#full -c cargo build

      - name: Build and serve WASI Component
        run: |
          nix develop .#full -c bash -euo pipefail -c '
            export PATH="$(dirname "$(rustup which rustc --toolchain stable)"):$PATH"
            ./target/debug/jet build \
              examples/features/net/http_server_wasip2.jet \
              --target=wasm32-wasip2
            wasm-tools validate build/http_server_wasip2
            wasmtime run -S inherit-network=y -S tcp=y build/http_server_wasip2 >wasip2-server.log 2>&1 &
            server_pid=$!
            trap "kill $server_pid 2>/dev/null || true" EXIT
            for _ in $(seq 1 30); do
              grep -q "true" wasip2-server.log && break
              sleep 1
            done
            grep -q "true" wasip2-server.log
            curl --fail --silent --max-time 5 http://127.0.0.1:18080/ | grep -Fx "hello from wasip2"
          '

  rust-lint:
    name: Rustfmt and Clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Rustfmt gate (D-CI2)
        run: nix develop .#full -c cargo fmt --all -- --check

      - name: Curated Clippy gate (D-CI2)
        run: >-
          nix develop .#full -c cargo clippy --workspace --all-targets --locked --
          -D warnings
          -A clippy::all
          -A clippy::style
          -D clippy::correctness
          -D clippy::suspicious

  # #211 (D-CI1=A): the complete cargo test-target inventory (every lib/bin/
  # test target `cargo metadata` names across the whole workspace — not just
  # the "."/jet-driver/jetpack-bin/jetos default-members plain `cargo test`
  # silently limited itself to), sharded across parallel jobs so PR wall-clock
  # stays sane as the suite grows. tools/ci/test-shards.sh enumerates targets
  # fresh every run, so a newly added test file always lands in some shard —
  # it can never silently fall out of the gate the way default-members did.
  # tests/release_gates.rs proves shard_count here matches SHARD_COUNT below
  # and that the shards' union is the exact `cargo metadata` inventory.
  verify-tests:
    name: Verify tests (shard ${{ matrix.shard }}/6)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      RUSTFLAGS: "-D warnings"
      JET_REQUIRE_RUSTC: "1"
      JET_TEST_SHARD: ${{ matrix.shard }}
      JET_TEST_SHARD_COUNT: "6"
      JET_CI_EVIDENCE_DIR: ${{ github.workspace }}/ci-evidence/shard-${{ matrix.shard }}
      JET_CI_ARTIFACT_NAME: ci-gate-evidence-shard-${{ matrix.shard }}-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start durable gate evidence
        if: always()
        run: |
          mkdir -p "$JET_CI_EVIDENCE_DIR"
          {
            echo "schema=jet.ci-evidence.v1"
            echo "status=started"
            echo "candidate_commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "workflow=$GITHUB_WORKFLOW"
            echo "job=$GITHUB_JOB"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "event=$GITHUB_EVENT_NAME"
            echo "ref=$GITHUB_REF"
          } >"$JET_CI_EVIDENCE_DIR/job.txt"

      - name: Failure propagation canary
        run: |
          set +e
          bash tools/ci/ci-evidence.sh \
            --report-dir "$JET_CI_EVIDENCE_DIR/canary" \
            -- bash -c 'printf "expected canary failure\\n" >&2; exit 23'
          status=$?
          set -e
          test "$status" -eq 23
          grep -Fxq "status=fail" "$JET_CI_EVIDENCE_DIR/canary/receipt.txt"
          grep -Fxq "command_exit=23" "$JET_CI_EVIDENCE_DIR/canary/receipt.txt"

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify suite shard (D-CI1)
        run: bash tools/ci/ci-evidence.sh --report-dir "$JET_CI_EVIDENCE_DIR" -- nix develop .#full -c scripts/agent/verify-full.sh

      - name: Finalize durable gate evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "schema=jet.ci-evidence.v1"
            echo "status=$JOB_STATUS"
            echo "candidate_commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "artifact_name=$JET_CI_ARTIFACT_NAME"
            echo "receipt=$JET_CI_EVIDENCE_DIR/receipt.txt"
          } >"$JET_CI_EVIDENCE_DIR/job-final.txt"

      - name: Upload durable gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-evidence-shard-${{ matrix.shard }}-${{ github.sha }}
          path: ci-evidence/shard-${{ matrix.shard }}/
          retention-days: 30
          if-no-files-found: error

  nightly-fuzz:
    name: Nightly rotating-seed fuzz + perf ratchet
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Rotating-seed sema fuzz (N=1000)
        env:
          JET_REQUIRE_RUSTC: "1"
          FUZZ_VARIANTS: "1000"
        run: |
          seed="$(date -u +%Y%m%d)"
          echo "nightly fuzz seed: $seed"
          FUZZ_SEED="$seed" nix develop -c cargo test --release --test fuzz_sema -- --nocapture

      - name: Build Jet for perf gates
        env:
          CARGO_BUILD_JOBS: "6"
        run: nix develop .#full -c cargo build

      - name: Perf ratchet
        run: |
          nix develop -c sh tools/perf/ci-perf-check.sh
          nix develop .#full -c bash tools/perf/web-bundle-check.sh
