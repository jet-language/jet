# Hosted CI runs the cheap source-coverage ratchet and the Core surface ledger
# and CoreCall registry checks, which need the committed Tower board. The native compiler check
# and the full gate suite run locally through Tools/agent/LaneCheck.jet and
# Tools/agent/verify-full.sh until a pinned native seed release exists
# (D-SEED-DIST1).
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Core source coverage and surface ledger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Core source coverage ratchet
        run: |
          node --test Tools/agent/core-coverage-census.test.mjs
          node Tools/agent/core-coverage-census.mjs --check

      - name: Core surface ledger and CoreCall registry are current
        run: |
          node Tools/agent/check-core-surface-ledger.mjs --check
          node Tools/agent/check-core-surface-ledger.mjs --check-core-call-registry
