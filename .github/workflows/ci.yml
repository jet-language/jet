name: CI

# D-CI1=A: the complete cargo test-target inventory, sharded, on every push
# (flags red). Nightly lane adds rotating-seed fuzzing (N>=1000) and perf
# ratchet. c730 adds the named JIT/AOT parity job.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  cffi-native-matrix:
    name: C ABI native (linux-x64)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Required native C ABI proof
        env:
          JET_CFFI_MATRIX_REQUIRED: "1"
          JET_CFFI_CC: clang
          JET_CFFI_AR: llvm-ar
          JET_CFFI_RUSTC: rustc
          JET_CFFI_ABI: sysv64
        run: cargo test --test cffi_native_matrix -- --nocapture

  cffi-native-aarch64:
    name: C ABI native (linux-aarch64-qemu)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
      - name: Required aarch64 C ABI proof
        env:
          JET_CFFI_MATRIX_REQUIRED: "1"
          JET_CFFI_CC: aarch64-linux-gnu-gcc
          JET_CFFI_AR: aarch64-linux-gnu-ar
          JET_CFFI_RUSTC: rustc
          JET_CFFI_RUST_TARGET: aarch64-unknown-linux-gnu
          JET_CFFI_RUST_LINKER: aarch64-linux-gnu-gcc
          JET_CFFI_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
          JET_CFFI_ABI: default
        run: cargo test --test cffi_native_matrix -- --nocapture

  jetpack-platform:
    name: Jetpack platform audit (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Windows core.path normalization runtime proof
        if: matrix.os == 'windows-latest'
        run: cargo test --test path_durability -- --nocapture

      - name: Platform audit
        run: cargo test --test jetpack_platform

      - name: Native core.os facts and interrupt lifecycle
        run: cargo test --test os_native -- --nocapture

      - name: Windows core.os Ctrl-C runtime proof
        if: matrix.os == 'windows-latest'
        run: cargo test --test os_interrupt_windows -- --nocapture

      - name: Windows native IOCP scheduler proof
        if: matrix.os == 'windows-latest'
        run: |
          cargo test -p jet-codegen iocp_wake_cancel_deadline_stale_scale_and_cleanup -- --nocapture
          cargo test --test scheduler_native -- --nocapture

  # c730: named strict JIT↔AOT parity job. Matrix = every host where native
  # Cranelift JIT is supported today (x86_64 only). aarch64 / Apple Silicon /
  # Windows ARM leave the matrix with named reason in the report artifact
  # (cranelift_host_supported is x86_64-only).
  jit-aot-parity:
    name: JIT/AOT parity (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-13
            label: macos-x86_64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strict JIT/AOT differential gate (#727)
        shell: bash
        env:
          JET_REQUIRE_RUSTC: "1"
          JET_REQUIRE_CRANELIFT_HOST: "1"
          JET_CORPUS_GATE_REPORT_DIR: ${{ github.workspace }}/jit-aot-parity-report
        run: bash tools/ci/jit-aot-parity.sh

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jit-aot-parity-${{ matrix.label }}-${{ github.sha }}
          path: jit-aot-parity-report/
          retention-days: 30
          if-no-files-found: error

  verify:
    name: Verify checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check

      - name: Cargo check
        run: nix develop -c cargo check

      - name: Install aarch64 cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: aarch64 freestanding QEMU smoke
        run: nix develop .#full -c bash tools/ci/aarch64-qemu-freestanding.sh

  # #211 (D-CI1=A): the complete cargo test-target inventory (every lib/bin/
  # test target `cargo metadata` names across the whole workspace — not just
  # the "."/jet-driver/jetpack-bin/jetos default-members plain `cargo test`
  # silently limited itself to), sharded across parallel jobs so PR wall-clock
  # stays sane as the suite grows. tools/ci/test-shards.sh enumerates targets
  # fresh every run, so a newly added test file always lands in some shard —
  # it can never silently fall out of the gate the way default-members did.
  # tests/release_gates.rs proves shard_count here matches SHARD_COUNT below
  # and that the shards' union is the exact `cargo metadata` inventory.
  verify-tests:
    name: Verify tests (shard ${{ matrix.shard }}/6)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      JET_REQUIRE_RUSTC: "1"
      JET_TEST_SHARD: ${{ matrix.shard }}
      JET_TEST_SHARD_COUNT: "6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify suite shard (D-CI1)
        run: nix develop .#full -c scripts/agent/verify-full.sh

  nightly-fuzz:
    name: Nightly rotating-seed fuzz + perf ratchet
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Rotating-seed sema fuzz (N=1000)
        env:
          JET_REQUIRE_RUSTC: "1"
          FUZZ_VARIANTS: "1000"
        run: |
          seed="$(date -u +%Y%m%d)"
          echo "nightly fuzz seed: $seed"
          FUZZ_SEED="$seed" nix develop -c cargo test --release --test fuzz_sema -- --nocapture

      - name: Perf ratchet
        run: nix develop -c sh tools/perf/ci-perf-check.sh
