name: CI

# CI paused during active development churn (2026-07-22).
# Automatic push/PR/schedule triggers removed; workflow kept for later restore.
# To re-enable, restore:
#   on:
#     push:
#     pull_request:
#     schedule:
#       - cron: "0 3 * * *"
# Previous policy (D-CI3=A): full suite on every push (flags red, never
# blocks). Nightly lane adds rotating-seed fuzzing (N>=1000) and perf ratchet.
on:
  workflow_dispatch:

jobs:
  cffi-native-matrix:
    name: C ABI native (linux-x64)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Required native C ABI proof
        env:
          JET_CFFI_MATRIX_REQUIRED: "1"
          JET_CFFI_CC: clang
          JET_CFFI_AR: llvm-ar
          JET_CFFI_RUSTC: rustc
          JET_CFFI_ABI: sysv64
        run: cargo test --test cffi_native_matrix -- --nocapture

  cffi-native-aarch64:
    name: C ABI native (linux-aarch64-qemu)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
      - name: Required aarch64 C ABI proof
        env:
          JET_CFFI_MATRIX_REQUIRED: "1"
          JET_CFFI_CC: aarch64-linux-gnu-gcc
          JET_CFFI_AR: aarch64-linux-gnu-ar
          JET_CFFI_RUSTC: rustc
          JET_CFFI_RUST_TARGET: aarch64-unknown-linux-gnu
          JET_CFFI_RUST_LINKER: aarch64-linux-gnu-gcc
          JET_CFFI_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
          JET_CFFI_ABI: default
        run: cargo test --test cffi_native_matrix -- --nocapture

  jetpack-platform:
    name: Jetpack platform audit (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Windows core.path normalization runtime proof
        if: matrix.os == 'windows-latest'
        run: cargo test --test path_durability -- --nocapture

      - name: Platform audit
        run: cargo test --test jetpack_platform

      - name: Native core.os facts and interrupt lifecycle
        run: cargo test --test os_native -- --nocapture

      - name: Windows core.os Ctrl-C runtime proof
        if: matrix.os == 'windows-latest'
        run: cargo test --test os_interrupt_windows -- --nocapture

      - name: Windows native IOCP scheduler proof
        if: matrix.os == 'windows-latest'
        run: |
          cargo test -p jet-codegen iocp_wake_cancel_deadline_stale_scale_and_cleanup -- --nocapture
          cargo test --test scheduler_native -- --nocapture

  verify:
    name: Full verify suite
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check

      - name: Cargo check
        run: nix develop -c cargo check

      - name: Full verify suite (D-CI3)
        env:
          JET_REQUIRE_RUSTC: "1"
        run: nix develop .#full -c scripts/agent/verify-full.sh

      - name: Install aarch64 cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: aarch64 freestanding QEMU smoke
        run: nix develop .#full -c bash tools/ci/aarch64-qemu-freestanding.sh

  nightly-fuzz:
    name: Nightly rotating-seed fuzz + perf ratchet
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Rotating-seed sema fuzz (N=1000)
        env:
          JET_REQUIRE_RUSTC: "1"
          FUZZ_VARIANTS: "1000"
        run: |
          seed="$(date -u +%Y%m%d)"
          echo "nightly fuzz seed: $seed"
          FUZZ_SEED="$seed" nix develop -c cargo test --release --test fuzz_sema -- --nocapture

      - name: Perf ratchet
        run: nix develop -c sh tools/perf/ci-perf-check.sh
