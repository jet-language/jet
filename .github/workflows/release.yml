name: Release

# Tagged releases (v*.*.*) publish prebuilt `jet`/`jetpack`/`jet-cc`/`jet-c++` binaries for the
# three native release hosts covered by the strict parity matrix. The channel
# bundle is unsigned signing input only; production signing and dl deployment
# remain owner-controlled operations outside this workflow.
# c730: tagged publication requires the same strict JIT/AOT parity gate on
# the tagged commit (x86_64 native hosts where Cranelift JIT is supported).
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  jit-aot-parity:
    name: JIT/AOT parity (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-15-intel
            label: macos-x86_64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Strict JIT/AOT differential gate (#727)
        shell: bash
        env:
          JET_REQUIRE_RUSTC: "1"
          JET_REQUIRE_CRANELIFT_HOST: "1"
          JET_CORPUS_GATE_REPORT_DIR: ${{ github.workspace }}/jit-aot-parity-report
        run: bash tools/ci/jit-aot-parity.sh

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-jit-aot-parity-${{ matrix.label }}-${{ github.sha }}
          path: jit-aot-parity-report/
          retention-days: 30
          if-no-files-found: error

  compiled-workload:
    name: Compiled workload gate (${{ matrix.label }})
    needs: jit-aot-parity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            platform: linux
            build: nix
          - os: macos-15-intel
            label: macos-x86_64
            platform: macos
            build: nix
          - os: windows-latest
            label: windows-x86_64
            platform: windows
            build: native
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Nix
        if: matrix.build == 'nix'
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Pin compiled-workload cross Rust on Linux
        if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install compiled-workload cross compiler on Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu

      - name: Pin compiled-workload Node on Windows
        if: matrix.build == 'native'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2

      - name: Pin compiled-workload Go on Windows
        if: matrix.build == 'native'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.5

      - name: Pin compiled-workload Rust on Windows
        if: matrix.build == 'native'
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5

      - name: Pin compiled-workload Zig on Windows
        if: matrix.build == 'native'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Pin compiled-workload Clang on Windows
        if: matrix.build == 'native'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: 21.1.8


      - name: Build optimized compiled-workload compiler (Unix)
        if: matrix.build == 'nix'
        shell: bash
        env:
          JET_COMPILED_WORKLOAD_JET_BIN: ${{ github.workspace }}/target/release/jet
          JET_COMPILED_WORKLOAD_PEER_LAUNCHER: ${{ runner.temp }}/compiled-workload-peer-launcher
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            toolchain_bin="$HOME/.rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu/bin"
            export RUSTC="$toolchain_bin/rustc"
            export RUSTC_LINKER_CROSS=aarch64-linux-gnu-gcc
            export CXX_CROSS=aarch64-linux-gnu-g++
            run_full() {
              # shellcheck disable=SC2016
              nix develop .#full -c bash -c \
                'export PATH="$1:$PATH"; shift; exec "$@"' bash "$toolchain_bin" "$@"
            }
          else
            run_full() {
              nix develop .#full -c "$@"
            }
          fi
          run_full rustc --edition=2021 -O tools/ci/compiled-workload-peer-launcher.rs \
            -o "$JET_COMPILED_WORKLOAD_PEER_LAUNCHER"
          test -x "$JET_COMPILED_WORKLOAD_PEER_LAUNCHER"
          run_full "$JET_COMPILED_WORKLOAD_PEER_LAUNCHER" --contract
          run_full cargo build --release --locked --bin jet
          test -x "$JET_COMPILED_WORKLOAD_JET_BIN"

      - name: Build optimized compiled-workload compiler (Windows)
        if: matrix.build == 'native'
        shell: bash
        env:
          CXX: clang++
          JET_COMPILED_WORKLOAD_JET_BIN: ${{ github.workspace }}/target/release/jet.exe
          JET_COMPILED_WORKLOAD_PEER_LAUNCHER: ${{ runner.temp }}/compiled-workload-peer-launcher.exe
        run: |
          set -euo pipefail
          rustc --edition=2021 -O tools/ci/compiled-workload-peer-launcher.rs \
            -o "$JET_COMPILED_WORKLOAD_PEER_LAUNCHER"
          test -x "$JET_COMPILED_WORKLOAD_PEER_LAUNCHER"
          "$JET_COMPILED_WORKLOAD_PEER_LAUNCHER" --contract
          cargo build --release --locked --bin jet
          test -x "$JET_COMPILED_WORKLOAD_JET_BIN"

      - name: Download immutable reviewed compiled-workload bundle (Unix)
        if: matrix.build == 'nix'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="compiled-workload-reviewed-${{ matrix.label }}-${{ github.sha }}"
          artifact_response="$(gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")"
          artifact_ids="$(
            jq -r --arg name "$artifact_name" --arg sha "$GITHUB_SHA" '
              [.[] | .artifacts[] |
                select(.name == $name and .expired == false and .workflow_run.head_sha == $sha)] |
              .[].id
            ' <<<"$artifact_response"
          )"
          artifact_count="$(printf '%s\n' "$artifact_ids" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          test "$artifact_count" -eq 1 || {
            echo "expected exactly one unexpired reviewed artifact for ${artifact_name}" >&2
            exit 1
          }
          artifact_id="$(printf '%s\n' "$artifact_ids" | sed -n '1p')"
          bundle="$RUNNER_TEMP/compiled-workload-reviewed"
          archive="$RUNNER_TEMP/${artifact_name}.zip"
          rm -rf "$bundle"
          mkdir -p "$bundle"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            >"$archive"
          unzip -q "$archive" -d "$bundle"
          file_count="$(find "$bundle" -type f | wc -l | tr -d '[:space:]')"
          test "$file_count" -eq 11
          for file in identity.tsv samples.tsv statistics.tsv outcomes.tsv measurements.tsv tiers.tsv receipts.tsv tier_receipts.tsv peer_coverage.tsv peer_measurements.tsv review.tsv; do
            test -f "$bundle/$file"
          done
          rm -rf compiled-workload-report
          mkdir -p compiled-workload-report
          cp "$bundle"/*.tsv compiled-workload-report/

      - name: Download immutable reviewed compiled-workload bundle (Windows)
        if: matrix.build == 'native'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="compiled-workload-reviewed-${{ matrix.label }}-${{ github.sha }}"
          artifact_response="$(gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")"
          artifact_ids="$(
            jq -r --arg name "$artifact_name" --arg sha "$GITHUB_SHA" '
              [.[] | .artifacts[] |
                select(.name == $name and .expired == false and .workflow_run.head_sha == $sha)] |
              .[].id
            ' <<<"$artifact_response"
          )"
          artifact_count="$(printf '%s\n' "$artifact_ids" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          test "$artifact_count" -eq 1 || {
            echo "expected exactly one unexpired reviewed artifact for ${artifact_name}" >&2
            exit 1
          }
          artifact_id="$(printf '%s\n' "$artifact_ids" | sed -n '1p')"
          bundle="$RUNNER_TEMP/compiled-workload-reviewed"
          archive="$RUNNER_TEMP/${artifact_name}.zip"
          rm -rf "$bundle"
          mkdir -p "$bundle"
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            >"$archive"
          unzip -q "$archive" -d "$bundle"
          file_count="$(find "$bundle" -type f | wc -l | tr -d '[:space:]')"
          test "$file_count" -eq 11
          for file in identity.tsv samples.tsv statistics.tsv outcomes.tsv measurements.tsv tiers.tsv receipts.tsv tier_receipts.tsv peer_coverage.tsv peer_measurements.tsv review.tsv; do
            test -f "$bundle/$file"
          done
          rm -rf compiled-workload-report
          mkdir -p compiled-workload-report
          cp "$bundle"/*.tsv compiled-workload-report/

      - name: Validate reviewed compiled-workload report and compiler (Unix)
        if: matrix.build == 'nix'
        shell: bash
        env:
          JET_COMPILED_WORKLOAD_JET_BIN: ${{ github.workspace }}/target/release/jet
        run: |
          set -euo pipefail
          report=compiled-workload-report
          reviewed_hash="$(node -e 'const fs=require("node:fs"); const row=fs.readFileSync(process.argv[1],"utf8").split(/\r?\n/).find(line => line.split("\t")[1] === "jet_binary_sha256"); if (!row) process.exit(1); process.stdout.write(row.split("\t")[2] || "");' "$report/identity.tsv")"
          local_hash="$(node -e 'const fs=require("node:fs"); const crypto=require("node:crypto"); process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"));' "$JET_COMPILED_WORKLOAD_JET_BIN")"
          [[ "$reviewed_hash" =~ ^[0-9a-f]{64}$ ]]
          test "$reviewed_hash" = "$local_hash"
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            toolchain_bin="$HOME/.rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu/bin"
            run_full() {
              # shellcheck disable=SC2016
              nix develop .#full -c bash -c \
                'export PATH="$1:$PATH"; shift; exec "$@"' bash "$toolchain_bin" "$@"
            }
          else
            run_full() {
              nix develop .#full -c "$@"
            }
          fi
          run_full env JET_COMPILED_WORKLOAD_JET_BIN="$JET_COMPILED_WORKLOAD_JET_BIN" \
            bash tools/ci/compiled-workload-gate.sh --check "$report"

      - name: Validate reviewed compiled-workload report and compiler (Windows)
        if: matrix.build == 'native'
        shell: bash
        env:
          JET_COMPILED_WORKLOAD_JET_BIN: ${{ github.workspace }}/target/release/jet.exe
        run: |
          set -euo pipefail
          report=compiled-workload-report
          reviewed_hash="$(node -e 'const fs=require("node:fs"); const row=fs.readFileSync(process.argv[1],"utf8").split(/\r?\n/).find(line => line.split("\t")[1] === "jet_binary_sha256"); if (!row) process.exit(1); process.stdout.write(row.split("\t")[2] || "");' "$report/identity.tsv")"
          local_hash="$(node -e 'const fs=require("node:fs"); const crypto=require("node:crypto"); process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"));' "$JET_COMPILED_WORKLOAD_JET_BIN")"
          [[ "$reviewed_hash" =~ ^[0-9a-f]{64}$ ]]
          test "$reviewed_hash" = "$local_hash"
          bash tools/ci/compiled-workload-gate.sh --check "$report"

      - name: Upload reviewed compiled-workload report (Unix)
        if: ${{ always() && matrix.build == 'nix' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-compiled-workload-${{ matrix.label }}-${{ github.sha }}
          path: compiled-workload-report/
          retention-days: 30
          if-no-files-found: error

      - name: Upload reviewed compiled-workload report (Windows)
        if: ${{ always() && matrix.build == 'native' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-compiled-workload-${{ matrix.label }}-${{ github.sha }}
          path: compiled-workload-report/
          retention-days: 30
          if-no-files-found: error

      - name: Upload exact compiled-workload compiler (Unix)
        if: ${{ success() && matrix.build == 'nix' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-compiled-workload-jet-${{ matrix.label }}-${{ github.sha }}
          path: target/release/jet
          retention-days: 30
          if-no-files-found: error

      - name: Upload exact compiled-workload compiler (Windows)
        if: ${{ success() && matrix.build == 'native' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-compiled-workload-jet-${{ matrix.label }}-${{ github.sha }}
          path: target/release/jet.exe
          retention-days: 30
          if-no-files-found: error

  build:
    name: Build (${{ matrix.label }})
    needs: [jit-aot-parity, compiled-workload]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: jet-linux-x86_64
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            build: nix
          - os: macos-15-intel
            artifact: jet-macos-x86_64
            label: macos-x86_64
            target: x86_64-apple-darwin
            build: nix
          - os: windows-latest
            artifact: jet-windows-x86_64
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            build: native
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Nix
        if: matrix.build == 'nix'
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Download exact compiled-workload compiler
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-compiled-workload-jet-${{ matrix.label }}-${{ github.sha }}
          path: release-compiled-workload-jet

      - name: Build release companion binaries (Unix)
        if: matrix.build == 'nix'
        run: nix develop .#full -c cargo build --release --locked --bin jetpack --bin jet-cc --bin jet-cxx

      - name: Build release companion binaries (Windows)
        if: matrix.build == 'native'
        shell: bash
        run: cargo build --release --locked --bin jetpack --bin jet-cc --bin jet-cxx

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/package
          if [ "${{ matrix.build }}" = native ]; then
            jet_bin="release-compiled-workload-jet/jet.exe"
            jetpack_bin="target/release/jetpack.exe"
            jetcc_bin="target/release/jet-cc.exe"
            jetcxx_bin="target/release/jet-c++.exe"
            mv target/release/jet-cxx.exe "$jetcxx_bin"
          else
            jet_bin="release-compiled-workload-jet/jet"
            jetpack_bin="target/release/jetpack"
            jetcc_bin="target/release/jet-cc"
            jetcxx_bin="target/release/jet-c++"
            mv target/release/jet-cxx "$jetcxx_bin"
          fi
          for binary in "$jet_bin" "$jetpack_bin" "$jetcc_bin" "$jetcxx_bin"; do
            test -f "$binary"
          done
          cp "$jet_bin" "$jetpack_bin" "$jetcc_bin" "$jetcxx_bin" dist/package/
          capsule_bytes="$(wc -c < tools/agent-eval/jet-context-capsule.md)"
          test "$capsule_bytes" -le 32768
          cp tools/agent-eval/jet-context-capsule.md dist/package/
          tar -C dist/package -czf "dist/${{ matrix.artifact }}.tar.gz" .
          mkdir -p dist/toolchain
          cp "$jet_bin" "dist/toolchain/jet-${version}-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  prepare-channel:
    name: Prepare unsigned toolchain channel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download native toolchain inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          pattern: jet-*
          merge-multiple: true
      - name: Download reviewed compiled-workload reports (#2943)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: candidate-input/reports
          pattern: release-compiled-workload-*
          merge-multiple: false

      - name: Download exact candidate qualification record (#2943)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="release-candidate-${GITHUB_SHA}"
          artifact_response="$(gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")"
          artifact_ids="$(
            jq -r --arg name "$artifact_name" --arg sha "$GITHUB_SHA" '
              [.[] | .artifacts[] |
                select(.name == $name and .expired == false and .workflow_run.head_sha == $sha)] |
                .[].id
            ' <<<"$artifact_response"
          )"
          artifact_count="$(printf '%s\n' "$artifact_ids" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          test "$artifact_count" -eq 1 || {
            echo "expected exactly one unexpired candidate qualification artifact for ${artifact_name}; run the qualification/closeout producer first" >&2
            exit 1
          }
          artifact_id="$(printf '%s\n' "$artifact_ids" | sed -n '1p')"
          archive="$RUNNER_TEMP/${artifact_name}.zip"
          unpack="$RUNNER_TEMP/candidate-qualification"
          rm -rf "$unpack"
          mkdir -p "$unpack" candidate-input/candidate
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            >"$archive"
          unzip -q "$archive" -d "$unpack"
          candidate_paths="$(find "$unpack" -type f -name candidate.json -print)"
          test "$(printf '%s\n' "$candidate_paths" | sed '/^$/d' | wc -l | tr -d '[:space:]')" -eq 1
          cp "$candidate_paths" candidate-input/candidate/candidate.json

      - name: Validate reviewed reports and candidate identity (#2943)
        shell: bash
        run: |
          set -euo pipefail
          reports=(
            "candidate-input/reports/release-compiled-workload-linux-x86_64-${GITHUB_SHA}/"
            "candidate-input/reports/release-compiled-workload-macos-x86_64-${GITHUB_SHA}/"
            "candidate-input/reports/release-compiled-workload-windows-x86_64-${GITHUB_SHA}/"
          )
          for report in "${reports[@]}"; do
            test -d "$report" || {
              echo "candidate workload report is missing: $report" >&2
              exit 1
            }
            JET_COMPILED_WORKLOAD_CANDIDATE_COMMIT="$GITHUB_SHA" \
              bash tools/ci/compiled-workload-gate.sh --check "$report"
          done
          CANDIDATE_REPORT_ROOT=candidate-input/reports \
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { readCandidateWorkloadReportRelation } from "./scripts/agent/hardening-manifest.mjs";

          const candidate = JSON.parse(readFileSync("candidate-input/candidate/candidate.json", "utf8"));
          const reports = readCandidateWorkloadReportRelation(process.env.CANDIDATE_REPORT_ROOT);
          if ((candidate.commit ?? candidate.candidate_identity?.commit) !== reports.commit) {
            throw new Error("candidate record and workload reports have different commits");
          }
          for (const key of [
            "source",
            "compiler",
            "configuration",
            "generated_artifact",
            "target_tool",
            "consumed_test_oracle",
            "behavior",
            "performance",
            "platform",
            "binary",
          ]) {
            const recorded = candidate.dependencies?.[key];
            const expected = reports.dependencies?.[key];
            if (!recorded || !expected
              || recorded.id !== expected.id
              || recorded.status !== expected.status
              || recorded.sha256 !== expected.sha256) {
              throw new Error(`candidate dependency is not bound to current workload reports: ${key}`);
            }
          }
          NODE
          mkdir -p dist/candidate
          cp candidate-input/candidate/candidate.json dist/candidate/candidate.json
          GITHUB_SHA="$GITHUB_SHA" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const candidate = JSON.parse(readFileSync("dist/candidate/candidate.json", "utf8"));
          const commit = candidate.commit ?? candidate.candidate_identity?.commit;
          if (commit !== process.env.GITHUB_SHA) {
            throw new Error(`candidate record commit ${String(commit)} differs from ${process.env.GITHUB_SHA}`);
          }
          NODE
          node scripts/agent/hardening-manifest.mjs \
            --candidate-check dist/candidate/candidate.json \
            --require-qualified \
            --require-release-claim \
            --release-channel stable

      - name: Stage manifest and signing requests
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node tools/jetpack-infra/stage-toolchain.mjs \
            --version "$version" \
            --sequence "$GITHUB_RUN_NUMBER" \
            --channel stable \
            --min-version 1.0.0 \
            --output channel-staging \
            --artifact x86_64-unknown-linux-gnu="dist/toolchain/jet-${version}-x86_64-unknown-linux-gnu" \
            --artifact x86_64-apple-darwin="dist/toolchain/jet-${version}-x86_64-apple-darwin" \
            --artifact x86_64-pc-windows-msvc="dist/toolchain/jet-${version}-x86_64-pc-windows-msvc"
          mkdir -p dist/channel
          tar -C channel-staging -czf "dist/channel/toolchain-channel-requests-${version}.tar.gz" .
      - name: Upload candidate qualification artifact (#2943)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate/candidate.json
          if-no-files-found: error


      - name: Upload unsigned channel requests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toolchain-channel-requests
          path: dist/channel/toolchain-channel-requests-*.tar.gz

  release:
    name: Publish GitHub release
    needs: [jit-aot-parity, compiled-workload, build, prepare-channel]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          pattern: jet-*
          merge-multiple: true

      - name: Download unsigned channel requests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: toolchain-channel-requests
          path: dist/channel
      - name: Download candidate qualification artifact (#2943)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/candidate

      - name: Validate exact candidate before publication (#2943)
        run: |
          test -f dist/candidate/candidate.json || { echo "candidate qualification artifact is missing" >&2; exit 1; }
          node scripts/agent/hardening-manifest.mjs \
            --candidate-check dist/candidate/candidate.json \
            --require-qualified \
            --require-release-claim \
            --release-channel stable

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/channel/*.tar.gz dist/candidate/candidate.json \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --repo "${{ github.repository }}"
