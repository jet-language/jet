name: Release

# Tagged releases (v*.*.*) publish prebuilt `jet`/`jetpack`/`jet-cc`/`jet-c++` binaries for the
# three native release hosts covered by the strict parity matrix. The channel
# bundle is unsigned signing input only; production signing and dl deployment
# remain owner-controlled operations outside this workflow.
# c730: tagged publication requires the same strict JIT/AOT parity gate on
# the tagged commit (x86_64 native hosts where Cranelift JIT is supported).
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  jit-aot-parity:
    name: JIT/AOT parity (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-13
            label: macos-x86_64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strict JIT/AOT differential gate (#727)
        shell: bash
        env:
          JET_REQUIRE_RUSTC: "1"
          JET_REQUIRE_CRANELIFT_HOST: "1"
          JET_CORPUS_GATE_REPORT_DIR: ${{ github.workspace }}/jit-aot-parity-report
        run: bash tools/ci/jit-aot-parity.sh

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-jit-aot-parity-${{ matrix.label }}-${{ github.sha }}
          path: jit-aot-parity-report/
          retention-days: 30
          if-no-files-found: error

  build:
    name: Build (${{ matrix.label }})
    needs: jit-aot-parity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: jet-linux-x86_64
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            build: nix
          - os: macos-13
            artifact: jet-macos-x86_64
            label: macos-x86_64
            target: x86_64-apple-darwin
            build: nix
          - os: windows-latest
            artifact: jet-windows-x86_64
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            build: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        if: matrix.build == 'nix'
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build jet
        if: matrix.build == 'nix'
        run: nix build .#jet

      - name: Build jet on Windows
        if: matrix.build == 'native'
        shell: bash
        run: cargo build --release --locked --bin jet --bin jetpack --bin jet-cc --bin jet-cxx

      - name: Package artifact
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.build }}" = native ]; then
            mv target/release/jet-cxx.exe target/release/jet-c++.exe
          fi
          mkdir -p dist/package
          if [ "${{ matrix.build }}" = nix ]; then
            binary="result/bin/jet"
            cp result/bin/jet result/bin/jetpack result/bin/jet-cc result/bin/jet-c++ dist/package/
          else
            binary="target/release/jet.exe"
            cp target/release/jet.exe target/release/jetpack.exe target/release/jet-cc.exe target/release/jet-c++.exe dist/package/
          fi
          capsule_bytes="$(wc -c < tools/agent-eval/jet-context-capsule.md)"
          test "$capsule_bytes" -le 32768
          cp tools/agent-eval/jet-context-capsule.md dist/package/
          tar -C dist/package -czf "dist/${{ matrix.artifact }}.tar.gz" .
          mkdir -p dist/toolchain
          cp "$binary" "dist/toolchain/jet-${version}-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  prepare-channel:
    name: Prepare unsigned toolchain channel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native toolchain inputs
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jet-*
          merge-multiple: true

      - name: Stage manifest and signing requests
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node tools/jetpack-infra/stage-toolchain.mjs \
            --version "$version" \
            --sequence "$GITHUB_RUN_NUMBER" \
            --channel stable \
            --min-version 1.0.0 \
            --output channel-staging \
            --artifact x86_64-unknown-linux-gnu="dist/toolchain/jet-${version}-x86_64-unknown-linux-gnu" \
            --artifact x86_64-apple-darwin="dist/toolchain/jet-${version}-x86_64-apple-darwin" \
            --artifact x86_64-pc-windows-msvc="dist/toolchain/jet-${version}-x86_64-pc-windows-msvc"
          mkdir -p dist/channel
          tar -C channel-staging -czf "dist/channel/toolchain-channel-requests-${version}.tar.gz" .

      - name: Upload unsigned channel requests
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-channel-requests
          path: dist/channel/toolchain-channel-requests-*.tar.gz

  release:
    name: Publish GitHub release
    needs: [jit-aot-parity, build, prepare-channel]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jet-*
          merge-multiple: true

      - name: Download unsigned channel requests
        uses: actions/download-artifact@v4
        with:
          name: toolchain-channel-requests
          path: dist/channel

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/channel/*.tar.gz \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --repo "${{ github.repository }}"
