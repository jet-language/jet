# The ini pair's corpus: a service configuration in the subset both arms
# read alike. Keys before the first section belong to DEFAULT.
owner = platform-team
region: eu-west-1

[server]
host = 0.0.0.0
port = 8080 ; the public port
workers: 16
name = "web one" ; the display name
banner = "Welcome to \"web one\"\tv2"
root = /srv/www/public
timeout.read = 30s
timeout.write = 45s

; logging goes to stderr unless a file is named
[logging]
level = info
format = "{time} {level} {target}: {message}"
file =
rotate = daily
keep: 14

[database]
url = postgres://app@db.internal:5432/main?sslmode=require
pool.min = 2
pool.max = 32
statement_timeout: 5000
password = 's3cr#t; not a comment'
replica.1 = postgres://app@replica-1.internal:5432/main
replica.2 = postgres://app@replica-2.internal:5432/main

[cache]
backend = redis
address = redis.internal:6379
ttl = 300
prefix = "app:v2:"
	indent-tab = kept after a tab

[features]
search = on
export = off
beta-ui = yes
dark_mode = true
max-upload = 64MiB

[server]
port = 8443
tls.cert = /etc/tls/server.pem
tls.key = /etc/tls/server.key

[mail]
from = "Service Desk <desk@example.com>"
relay = smtp.internal:25
subject.prefix = '[desk] '
signature = "line one\nline two"

[paths]
data = /var/lib/app
temp = /tmp/app
logs = /var/log/app
plugins = /usr/lib/app/plugins:/opt/app/plugins
