[package]
name = "jetpack"
version = "1.0.0"
edition = "2021"

[lib]
name = "jetpack"
path = "src/lib.rs"

[dependencies]
jet-foundation = { path = "../jet-foundation" }
jet-lexer = { path = "../jet-lexer" }
jet-parser = { path = "../jet-parser" }
jet-comptime = { path = "../jet-comptime" }
jet-sema = { path = "../jet-sema" }
jet-codegen = { path = "../jet-codegen" }

[dev-dependencies]
# D-TLS1: owner-ratified rustls bridge; test-only loopback peer.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# D-TLS1: owner-ratified system-root contract; test fixture exercises failure mapping.
rustls-native-certs = "0.7"
