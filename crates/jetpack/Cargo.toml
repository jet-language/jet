[package]
name = "jetpack"
version = "1.0.0"
edition = "2021"

[lib]
name = "jetpack"
path = "src/lib.rs"

[features]
# Card #650: opt-in seam so integration tests (which link this crate as an
# ordinary dependency, not via #[cfg(test)]) can backdate a hangar entry's
# `last_used_at` to simulate staleness/GC scenarios without waiting real
# time. Off by default — no release build enables it, so it never ships.
test-seam = []

[dependencies]
jet-foundation = { path = "../jet-foundation" }
jet-lexer = { path = "../jet-lexer" }
jet-parser = { path = "../jet-parser" }
jet-comptime = { path = "../jet-comptime" }
jet-sema = { path = "../jet-sema" }
jet-codegen = { path = "../jet-codegen" }
jet-pkg-model = { path = "../jet-pkg-model" }
jet-env-model = { path = "../jet-env-model" }
jet-nix-eval = { path = "../jet-nix-eval" }
