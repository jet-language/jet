[package]
name = "jetpack"
version = "1.0.0"
edition = "2021"

[lib]
name = "jetpack"
path = "src/lib.rs"

[dependencies]
jet-foundation = { path = "../jet-foundation" }
jet-lexer = { path = "../jet-lexer" }
jet-parser = { path = "../jet-parser" }
jet-comptime = { path = "../jet-comptime" }
jet-sema = { path = "../jet-sema" }
jet-codegen = { path = "../jet-codegen" }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
