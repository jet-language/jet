[package]
name = "jet-pkg-model"
version = "1.0.0"
edition = "2021"

[lib]
name = "jet_pkg_model"
path = "src/lib.rs"

[dependencies]
jet-sema = { path = "../jet-sema" }
# D-DEP1 / D-DX5-HOOK1: compiler-extension WASM host (same wasmtime Component
# Model pin as application plugins D-DEP-WASM1). Linked into the compiler so
# post-sema `analyze` can run in-process; guests stay untrusted sandboxes.
wasmtime = { version = "26", features = ["component-model"] }

[dev-dependencies]
# D-DEP1: owner-sanctioned rustls bridge; test-only loopback peer (FFI.rs's
# generated HTTPS bridge template, moved here from jetpack by card #367).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# D-DEP1: owner-sanctioned system-root bridge; test fixture exercises failure mapping.
rustls-native-certs = "0.7"
# D-EMAIL-DKIM-CONFIG1: native DKIM interoperability verifier.
ed25519-dalek = "2"
# D-EMAIL-DKIM-CONFIG1: real SHA-256 body-hash verification.
sha2 = "0.10"
