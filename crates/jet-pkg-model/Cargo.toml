[package]
name = "jet-pkg-model"
version = "1.0.0"
edition = "2021"

[lib]
name = "jet_pkg_model"
path = "src/lib.rs"

[dependencies]
jet-sema = { path = "../jet-sema" }

[dev-dependencies]
# D-TLS1: owner-ratified rustls bridge; test-only loopback peer (FFI.rs's
# generated HTTPS bridge template, moved here from jetpack by card #367).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# D-TLS1: owner-ratified system-root contract; test fixture exercises failure mapping.
rustls-native-certs = "0.7"
