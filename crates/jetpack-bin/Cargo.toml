[package]
name = "jetpack-bin"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "jetpack"
path = "src/main.rs"

[dependencies]
jetpack = { path = "../jetpack" }
jet-pkg-model = { path = "../jet-pkg-model" }
jet-comptime = { path = "../jet-comptime" }
# D-DEP1 / D-DX5-HOOK1: isolated compiler-extension Component Model host.
# Package boundary keeps Wasmtime out of the `jetpack` library linked by `jet`.
wasmtime = { version = "25", features = ["component-model"] }

[dev-dependencies]
jet-driver = { path = "../jet-driver" }
# D-DEP1 / D-DX5-HOOK1: the test fixture's WAT parser is an approved tool-only dependency.
wat = "1"
