[package]
name = "jet-sema"
version = "1.0.0"
edition = "2021"

[lib]
name = "jet_sema"
path = "src/lib.rs"

[dependencies]
jet-foundation = { path = "../jet-foundation" }
jet-lexer = { path = "../jet-lexer" }
jet-parser = { path = "../jet-parser" }
jet-comptime = { path = "../jet-comptime" }

[dev-dependencies]
# Package tests call `check_bundle` without the driver; they still need the
# canonical TirBridge installer (same seam as `boot_tir_eval` / `jet` main).
jet-codegen = { path = "../jet-codegen" }
