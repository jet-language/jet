[package]
name = "jet-jit"
version = "1.0.0"
edition = "2021"
description = "Jet Cranelift JIT backend (D-JITDEP1 / D-JIT2=A) — tier-1 dev-loop accelerator"

[lib]
name = "jet_jit"
path = "src/lib.rs"

[dependencies]
jet-foundation = { path = "../jet-foundation" }
jet-codegen = { path = "../jet-codegen" }
jet-rt = { path = "../jet-rt" }
jet-pkg-model = { path = "../jet-pkg-model" }

# D-JITDEP1 / D-JIT2=A: owner-approved runtime-side dep.
# M1: first CLIF emitter path for the resident-safe subset.
# Carries native-ize obligation: own JIT replaces Cranelift at end of
# the frozen c140→c141 progression.
cranelift-jit = "0.112"
# D-JITDEP1 / D-JIT2=A: owner-approved runtime-side dep.
cranelift-module = "0.112"
# D-JITDEP1 / D-JIT2=A: owner-approved runtime-side dep.
cranelift-frontend = "0.112"
# D-JITDEP1 / D-JIT2=A: owner-approved runtime-side dep.
cranelift-codegen = "0.112"
# D-JITDEP1 / D-JIT2=A: owner-approved runtime-side dep.
cranelift-native = "0.112"

# D-DEP1 / D-CODECS1: owner-approved bootstrap crates for stream codecs.
# Archive containers are a dependency-free canonical runtime included by the
# JIT host; they do not add a second archive implementation here.
flate2 = "1"
# D-DEP1 / D-CORE-COMPRESS1 / D-CODECS1: owner-approved bootstrap codec.
zstd = "0.13"
# D-DEP1 / D-DEP-DB1: owner-approved rusqlite bootstrap, matching the FFI bridge.
rusqlite = { version = "0.31", features = ["bundled"] }

# D-JITDEP1 / D-JIT2 / D-DEP1: owner-approved exact bridge pins. The JIT
# D-CRYPTO-SUITE1: includes the canonical bridge sources; these do not
# introduce another crypto implementation.
# D-PWHASH1: exact password-hash feature selection.
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
# D-JITDEP1 / D-JIT2 / D-DEP1: owner-approved crypto bridge dependency.
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "password-hash"] }
# D-JITDEP1 / D-JIT2 / D-DEP1: owner-approved crypto bridge dependency.
blake3 = { version = "=1.8.2", default-features = false, features = ["std", "pure"] }
# D-JITDEP1 / D-JIT2 / D-DEP1: owner-approved crypto bridge dependency.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
# D-JITDEP1 / D-JIT2 / D-DEP1: owner-approved crypto bridge dependency.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "zeroize"] }
# D-JITDEP1 / D-JIT2 / D-DEP1: owner-approved crypto bridge dependency.
hkdf = { version = "=0.12.4", default-features = false, features = [] }
# D-JITDEP1 / D-JIT2 / D-DEP1: owner-approved crypto bridge dependency.
sha2 = { version = "=0.10.9", default-features = false, features = [] }
# D-JITDEP1 / D-JIT2 / D-DEP1: owner-approved crypto bridge dependency.
subtle = { version = "=2.6.1", default-features = false, features = [] }
# D-JITDEP1 / D-JIT2 / D-DEP1: owner-approved crypto bridge dependency.
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["precomputed-tables", "zeroize"] }
# D-JITDEP1 / D-JIT2 / D-DEP1: owner-approved crypto bridge dependency.
age = "0.10"
# D-JITDEP1 / D-JIT2 / D-DEP1: owner-approved TLS bridge. D-TLS1 / D-EMAIL1:
# the JIT uses the same verified client TLS runtime as the
# generated bridge for SMTP STARTTLS and implicit TLS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# D-JITDEP1 / D-JIT2 / D-DEP1: owner-approved TLS certificate bridge.
rustls-native-certs = "0.7"
