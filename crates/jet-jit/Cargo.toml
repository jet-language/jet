[package]
name = "jet-jit"
version = "1.0.0"
edition = "2021"
description = "Jet Cranelift JIT backend (D-JITDEP1 / D-JIT2=A) — tier-1 dev-loop accelerator"

[lib]
name = "jet_jit"
path = "src/lib.rs"

[dependencies]
jet-foundation = { path = "../jet-foundation" }
jet-codegen = { path = "../jet-codegen" }
jet-rt = { path = "../jet-rt" }

# D-JITDEP1 / D-JIT2=A: owner-approved runtime-side dep.
# M1: first CLIF emitter path for the resident-safe subset.
# Carries native-ize obligation: own JIT replaces Cranelift at end of
# the frozen c140→c141 progression.
cranelift-jit = "0.112"
# D-JITDEP1 / D-JIT2=A: owner-approved runtime-side dep.
cranelift-module = "0.112"
# D-JITDEP1 / D-JIT2=A: owner-approved runtime-side dep.
cranelift-frontend = "0.112"
# D-JITDEP1 / D-JIT2=A: owner-approved runtime-side dep.
cranelift-codegen = "0.112"
# D-JITDEP1 / D-JIT2=A: owner-approved runtime-side dep.
cranelift-native = "0.112"

# D-DEP1 / D-CORE-COMPRESS1 / D-CODECS1: owner-approved bootstrap crates,
# matching the FFI bridge (jet-pkg-model COMPRESS_*/ZIP_*/TAR_* specs).
# JIT hosts `include!` the canonical runtime; no third algorithm.
flate2 = "1"
# D-DEP1 / D-CORE-COMPRESS1 / D-CODECS1: owner-approved bootstrap codec.
zstd = "0.13"
# D-DEP1 / D-DEP-ARCHIVE1: owner-approved bootstrap archive container.
zip = "2"
# D-DEP1 / D-DEP-ARCHIVE1: owner-approved bootstrap archive container.
tar = "0"
# D-DEP1 / D-DEP-DB1: owner-approved rusqlite bootstrap, matching the FFI bridge.
rusqlite = { version = "0.31", features = ["bundled"] }
