<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jet notebook</title>
  <style>
    :root { color-scheme: light dark; --bg:#11151b; --panel:#1b222c; --line:#364252; --ink:#edf2f7; --muted:#a9b5c3; --accent:#70b7ff; --warn:#f3c969; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,sans-serif; }
    header { position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; padding:.7rem 1rem; background:var(--panel); border-bottom:1px solid var(--line); }
    h1 { font-size:1.1rem; margin:0 .75rem 0 0; }
    button, input, select { border:1px solid var(--line); border-radius:.35rem; background:var(--bg); color:var(--ink); padding:.4rem .55rem; }
    button { cursor:pointer; } button:hover { border-color:var(--accent); } button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
    #status { color:var(--muted); margin-left:auto; min-width:12rem; text-align:right; }
    main { width:min(1100px,100%); margin:0 auto; padding:1rem; }
    .cell { background:var(--panel); border:1px solid var(--line); border-radius:.5rem; margin:0 0 1rem; overflow:hidden; }
    .cell.stale { border-color:var(--warn); } .cell-head { display:flex; gap:.4rem; align-items:center; padding:.45rem .6rem; border-bottom:1px solid var(--line); color:var(--muted); }
    .cell-head strong { color:var(--ink); font-size:.8rem; } .cell-head .grow { flex:1; }
    textarea { display:block; width:100%; min-height:5rem; resize:vertical; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:.75rem; background:#0d1117; color:var(--ink); font:14px/1.5 ui-monospace,SFMono-Regular,monospace; }
    .output { padding:.7rem .75rem; white-space:pre-wrap; overflow:auto; font:14px/1.45 ui-monospace,SFMono-Regular,monospace; }
    .output .notice { color:var(--warn); font-family:system-ui,sans-serif; } .output img { max-width:100%; display:block; } .output iframe { width:100%; min-height:5rem; border:1px solid var(--line); background:white; }
    .empty { color:var(--muted); text-align:center; padding:3rem 1rem; border:1px dashed var(--line); border-radius:.5rem; }
    .offline { color:var(--warn); } .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  </style>
</head>
<body>
<header>
  <h1>Jet notebook</h1>
  <button id="new-jet">New Jet cell</button><button id="new-md">New Markdown cell</button>
  <button id="reopen">Reopen</button><button id="save">Save</button>
  <label>Path <input id="path" placeholder="analysis.jetnb" autocomplete="off"></label>
  <button id="open">Open</button><button id="merge">Merge</button>
  <label>Client <select id="client"><option value="first-party">First-party</option><option value="canvas">Canvas lens</option><option value="jupyter">Jupyter adapter</option></select></label>
  <button id="interrupt">Interrupt</button><button id="export-ipynb">Export ipynb</button><button id="export-jet">Export Jet</button>
  <span id="status" role="status" aria-live="polite">Connecting…</span>
</header>
<main>
  <section id="cells" aria-label="Notebook cells"></section>
  <div id="empty" class="empty">No cells yet. Add a Jet or Markdown cell to begin.</div>
  <p><label for="stdin">Input to the next <code>input()</code> call</label> <input id="stdin" autocomplete="off"><button id="send-stdin">Send input</button></p>
  <p><label for="complete">Complete names</label> <input id="complete" placeholder="prefix" autocomplete="off"><button id="complete-button">Complete</button> <span id="completion"></span></p>
  <p><label for="import-file">Import a Jupyter notebook</label> <input id="import-file" type="file" accept=".ipynb,application/json"></p>
</main>
<script>
(() => {
  'use strict';
  const cells = document.querySelector('#cells'), empty = document.querySelector('#empty'), status = document.querySelector('#status');
  const token = new URLSearchParams((location.hash || '').slice(1)).get('token') || '';
  const draftsKey = 'jet-notebook-drafts-v1';
  let state = null;
  const drafts = JSON.parse(localStorage.getItem(draftsKey) || '{}');
  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const encode = data => new URLSearchParams(Object.entries(data)).toString();
  async function request(route, data = {}) {
    const response = await fetch(route, { method:'POST', headers:{'Authorization':`Bearer ${token}`, 'Content-Type':'application/x-www-form-urlencoded'}, body:encode(data) });
    const body = await response.json();
    if (!response.ok || body.ok === false) throw new Error(body.error || 'notebook request failed');
    return body;
  }
  function setStatus(text, offline = false) { status.textContent = text; status.className = offline ? 'offline' : ''; }
  function saveDraft(id, source) { drafts[id] = source; localStorage.setItem(draftsKey, JSON.stringify(drafts)); }
  function outputNode(output) {
    const box = document.createElement('div'); box.className = 'output';
    if (!output) { box.textContent = 'No output yet.'; return box; }
    if (!output.live) { const n = document.createElement('div'); n.className = 'notice'; n.textContent = 'Stale output hidden. Run this cell again.'; box.append(n); return box; }
    if (output.quarantined) { const n = document.createElement('div'); n.className = 'notice'; n.textContent = 'Imported output is quarantined; run it locally before trusting it.'; box.append(n); }
    const text = document.createElement('pre'); text.textContent = output.text || '(no text/plain)'; box.append(text);
    (output.mime || []).forEach(part => {
      if (part.type === 'image/svg+xml') { const img = document.createElement('img'); img.alt = 'Jet plot'; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(part.data); box.append(img); }
      else if (part.type === 'text/html') { const frame = document.createElement('iframe'); frame.title = 'Sandboxed rich output'; frame.sandbox = ''; frame.srcdoc = part.data; box.append(frame); }
    });
    return box;
  }
  function render() {
    const list = (state && state.cells) || []; cells.replaceChildren(); empty.hidden = list.length > 0;
    list.forEach((cell, index) => {
      const wrap = document.createElement('article'); wrap.className = 'cell' + (cell.output && !cell.output.live ? ' stale' : ''); wrap.dataset.id = cell.id;
      const head = document.createElement('div'); head.className = 'cell-head';
      wrap.id = `cell-${cell.id}`;
      const label = document.createElement('strong'); label.textContent = `${index + 1} · ${cell.kind}`; head.append(label);
      const id = document.createElement('span'); id.textContent = cell.id.slice(0, 8); head.append(id);
      const sourceLink = document.createElement('a'); sourceLink.href = `#cell-${cell.id}`; sourceLink.textContent = 'source'; sourceLink.title = 'Stable source link'; head.append(sourceLink);
      const grow = document.createElement('span'); grow.className = 'grow'; head.append(grow);
      if (cell.kind === 'jet') {
        [['Run','run'],['Inspect','inspect'],['Debug','debug'],['Profile','profile']].forEach(([labelText, action]) => { const button = document.createElement('button'); button.textContent = labelText; button.onclick = () => act(action, cell.id); head.append(button); });
      }
      const area = document.createElement('textarea'); area.value = drafts[cell.id] ?? cell.source; area.setAttribute('aria-label', `${cell.kind} cell source`); area.oninput = () => saveDraft(cell.id, area.value); area.onblur = () => sync(cell.id, area.value); wrap.append(head, area, outputNode(cell.output)); cells.append(wrap);
    });
  }
  async function sync(id, source) { try { await request('/api/edit', {cell_id:id, source}); delete drafts[id]; localStorage.setItem(draftsKey, JSON.stringify(drafts)); return true; } catch (error) { saveDraft(id, source); setStatus(error.message, true); return false; } }
  async function refresh() { try { const body = await request('/api/state'); state = body.state || body; render(); setStatus(`${state.cells.length} cells · ${state.turns.length} turns`); } catch (error) { setStatus(`${error.message} · drafts saved locally`, true); } }
  async function act(action, id) {
    const area = document.querySelector(`[data-id="${CSS.escape(id)}"] textarea`); if (area && !(await sync(id, area.value))) return;
    try { const body = await request(`/api/${action}`, {cell_id:id, client:document.querySelector('#client').value, renderer:'jet-notebook'}); if (body.filename) download(body.filename, body.content); else { state = body.state || state; render(); setStatus(body.message || action); } } catch (error) { setStatus(error.message, true); }
  }
  async function add(kind) { try { const body = await request('/api/add', {kind, source:''}); state = body.state; render(); setStatus('cell added'); const last = cells.lastElementChild; last?.querySelector('textarea')?.focus(); } catch (error) { setStatus(error.message, true); } }
  function download(name, content) { const blob = new Blob([content], {type:'application/octet-stream'}); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = name; link.click(); URL.revokeObjectURL(link.href); }
  document.querySelector('#new-jet').onclick = () => add('jet'); document.querySelector('#new-md').onclick = () => add('markdown');
  document.querySelector('#reopen').onclick = async () => { try { const body = await request('/api/reopen'); state = body.state; render(); setStatus('reopened'); } catch (error) { setStatus(error.message, true); } };
  document.querySelector('#save').onclick = async () => { try { const synced = await Promise.all(Array.from(document.querySelectorAll('.cell textarea')).map(area => sync(area.closest('.cell').dataset.id, area.value))); if (synced.some(ok => !ok)) throw new Error('save skipped; edits remain in offline drafts'); const body = await request('/api/save', {path:document.querySelector('#path').value}); state = body.state; render(); setStatus(body.message || 'saved'); } catch (error) { setStatus(error.message, true); } };
  document.querySelector('#open').onclick = async () => { try { const body = await request('/api/open', {path:document.querySelector('#path').value}); state = body.state; render(); setStatus('opened'); } catch (error) { setStatus(error.message, true); } };
  document.querySelector('#merge').onclick = async () => { try { const body = await request('/api/merge', {path:document.querySelector('#path').value}); state = body.state; render(); setStatus('merged by stable cell ID'); } catch (error) { setStatus(error.message, true); } };
  document.querySelector('#interrupt').onclick = async () => { try { await request('/api/interrupt'); setStatus('interrupt requested'); } catch (error) { setStatus(error.message, true); } };
  document.querySelector('#export-ipynb').onclick = async () => { try { const body = await request('/api/export/ipynb'); download(body.filename, body.content); setStatus(body.loss); } catch (error) { setStatus(error.message, true); } };
  document.querySelector('#export-jet').onclick = async () => { try { const body = await request('/api/export/jet'); download(body.filename, body.content); setStatus(body.loss); } catch (error) { setStatus(error.message, true); } };
  document.querySelector('#send-stdin').onclick = async () => { try { await request('/api/stdin', {line:document.querySelector('#stdin').value}); document.querySelector('#stdin').value = ''; setStatus('input queued'); } catch (error) { setStatus(error.message, true); } };
  document.querySelector('#complete-button').onclick = async () => { try { const body = await request('/api/complete', {prefix:document.querySelector('#complete').value}); document.querySelector('#completion').textContent = body.message || ''; } catch (error) { setStatus(error.message, true); } };
  document.querySelector('#import-file').onchange = async event => { const file = event.target.files[0]; if (!file) return; try { const body = await request('/api/import', {text:await file.text()}); state = body.state; render(); setStatus(body.message || 'imported; review loss report'); } catch (error) { setStatus(error.message, true); } event.target.value = ''; };
  window.addEventListener('online', refresh); window.addEventListener('offline', () => setStatus('offline · drafts saved locally', true)); refresh();
})();
</script>
</body>
</html>
