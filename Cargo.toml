[workspace]
members = [
    ".",
    "crates/jet-foundation",
    "crates/jet-lexer",
    "crates/jet-parser",
    "crates/jet-comptime",
    "crates/jet-sema",
    "crates/jet-codegen",
    "crates/jet-driver",
    "crates/jet-pkg-model",
    "crates/jet-env-model",
    "crates/jetpack",
    "crates/jetos",
    "crates/jet-queries",
    "crates/jet-semindex",
    "crates/jet-impact",
    "crates/jet-jit",
    "crates/jet-rt",
    "crates/jet-net",
    "crates/jet-repl",
    "crates/jet-debug",
    "crates/jet-cli",
    "crates/jet-canvas",
    "crates/jet-devserver",
]
# Card #367 / D-PRODUCT-SPLIT1=C: `jetpack`/`jetos` own their binaries now
# (were thin root-package shims) — list them so a bare `cargo build` still
# produces all three binaries, matching the pre-split behavior.
default-members = [".", "crates/jet-driver", "crates/jetpack", "crates/jetos"]
# This is first-party package source, not a compiler workspace member. It has
# its own `[workspace]` and external `zip`/`tar` dependencies so CoreProvider
# can build it into the hangar without importing those dependencies into the
# I6-governed compiler workspace. `jet run` embeds the same canonical src/lib.rs.
exclude = ["corelib/core.archive/pkgs/archive"]
resolver = "2"

[package]
name = "jet"
version = "1.0.0"
edition = "2021"

[lib]
name = "jet"
path = "Source/lib.rs"

[[bin]]
name = "jet"
path = "Source/main.rs"

[dependencies]
jet-driver = { path = "crates/jet-driver" }
jetpack = { path = "crates/jetpack" }
jet-env-model = { path = "crates/jet-env-model" }
jet-foundation = { path = "crates/jet-foundation" }
jet-jit = { path = "crates/jet-jit" }
jet-queries = { path = "crates/jet-queries" }
jet-semindex = { path = "crates/jet-semindex" }
jet-impact = { path = "crates/jet-impact" }
jet-repl = { path = "crates/jet-repl" }
jet-debug = { path = "crates/jet-debug" }
jet-cli = { path = "crates/jet-cli" }
jet-canvas = { path = "crates/jet-canvas" }
jet-devserver = { path = "crates/jet-devserver" }
