[workspace]
members = [
    ".",
    "crates/jet-foundation",
    "crates/jet-lexer",
    "crates/jet-parser",
    "crates/jet-comptime",
    "crates/jet-sema",
    "crates/jet-codegen",
    "crates/jet-driver",
    "jet-net",
]
resolver = "2"

[package]
name = "jet"
version = "1.0.0"
edition = "2021"

# Invariant I6 (see CLAUDE.md): zero external dependencies in the compiler.

[lib]
name = "jet"
path = "Source/lib.rs"

[[bin]]
name = "jet"
path = "Source/main.rs"

[[bin]]
name = "jetpack"
path = "Source/Bin/Jetpack.rs"

[dependencies]
jet-driver = { path = "crates/jet-driver" }
