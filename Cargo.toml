[workspace]
members = [
    ".",
    "crates/jet-foundation",
    "crates/jet-lexer",
    "crates/jet-parser",
    "crates/jet-comptime",
    "crates/jet-sema",
    "crates/jet-codegen",
    "crates/jet-driver",
    "crates/jet-queries",
    "crates/jet-semindex",
    "crates/jet-impact",
    "crates/jet-jit",
    "crates/jet-rt",
    "crates/jet-net",
]
exclude = ["corelib/core.archive/pkgs/archive"]
resolver = "2"

[package]
name = "jet"
version = "1.0.0"
edition = "2021"

[lib]
name = "jet"
path = "Source/lib.rs"

[[bin]]
name = "jet"
path = "Source/main.rs"

[[bin]]
name = "jetpack"
path = "Source/Bin/Jetpack.rs"

[dependencies]
jet-driver = { path = "crates/jet-driver" }
jet-foundation = { path = "crates/jet-foundation" }
jet-jit = { path = "crates/jet-jit" }
jet-queries = { path = "crates/jet-queries" }
jet-semindex = { path = "crates/jet-semindex" }
jet-impact = { path = "crates/jet-impact" }
