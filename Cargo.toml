[workspace]
members = [
    ".",
    "crates/jet-foundation",
    "crates/jet-lexer",
    "crates/jet-parser",
    "crates/jet-comptime",
    "crates/jet-sema",
    "crates/jet-codegen",
    "crates/jet-driver",
    "crates/jet-pkg-model",
    "crates/jet-env-model",
    "crates/jet-nix-eval",
    "crates/jetpack",
    "crates/jetpack-bin",
    "crates/jetos",
    "crates/jet-queries",
    "crates/jet-semindex",
    "crates/jet-impact",
    "crates/jet-jit",
    "crates/jet-rt",
    "crates/jet-net",
    "crates/jet-repl",
    "crates/jet-debug",
    "crates/jet-cli",
    "crates/jet-canvas",
    "crates/jet-devserver",
]
# Card #367 / D-PRODUCT-SPLIT1=C: Jetpack/JetOS own their binaries now (were
# thin root-package shims). Jetpack's binary-only package keeps host-only
# dependencies out of its compiler-linked library; default build still ships
# all three binaries.
default-members = [".", "crates/jet-driver", "crates/jetpack-bin", "crates/jetos"]
# This is first-party package source, not a compiler workspace member. It has
# its own `[workspace]` and external `zip`/`tar` dependencies so CoreProvider
# can build it into the hangar without importing those dependencies into the
# I6-governed compiler workspace. `jet run` embeds the same canonical src/lib.rs.
exclude = ["corelib/core.archive/pkgs/archive"]
resolver = "2"

# Dev builds must not turn content-addressed hashing into the product's
# bottleneck: an unoptimized SHA256 runs ~5-10 MB/s, so a debug `jetpack env`
# spends tens of minutes digesting a warm multi-GB hangar (observed live).
# Optimizing only the hashing crate keeps dev compile times intact while
# store verification runs at release speed.
[profile.dev.package.jet-foundation]
opt-level = 3

# Same reasoning: the canonical-archive walker that feeds the hasher lives in
# jet-pkg-model; an unoptimized walk dominates once hashing is fast.
[profile.dev.package.jet-pkg-model]
opt-level = 3

# Same reasoning: the hangar closure WAL verifies an ed25519 receipt per
# store record on every graph load; unoptimized field arithmetic turns 1.5k
# verifications into ~10s of pure CPU per jetpack invocation.
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# The env warm path (plan, verify, provider dispatch) is jetpack's own code;
# at opt-level 0 a fully warm 28-package `jetpack env --prep` burns ~49s of
# CPU. opt-level 1 keeps debuginfo and cheap builds while cutting that walk.
[profile.dev.package.jetpack]
opt-level = 1

[package]
name = "jet"
version = "1.0.0"
edition = "2021"

[lib]
name = "jet"
path = "Source/lib.rs"

[[bin]]
name = "jet"
path = "Source/main.rs"

[[bin]]
name = "jet-cc"
path = "Source/main.rs"

[[bin]]
name = "jet-cxx"
path = "Source/main.rs"

[dependencies]
jet-driver = { path = "crates/jet-driver" }
jet-codegen = { path = "crates/jet-codegen" }
jetpack = { path = "crates/jetpack" }
jet-env-model = { path = "crates/jet-env-model" }
jet-foundation = { path = "crates/jet-foundation" }
jet-jit = { path = "crates/jet-jit" }
jet-queries = { path = "crates/jet-queries" }
jet-semindex = { path = "crates/jet-semindex" }
jet-impact = { path = "crates/jet-impact" }
jet-repl = { path = "crates/jet-repl" }
jet-debug = { path = "crates/jet-debug" }
jet-cli = { path = "crates/jet-cli" }
jet-canvas = { path = "crates/jet-canvas" }
jet-devserver = { path = "crates/jet-devserver" }

# Card #650: `test-seam` unlocks a test-only hangar backdating API
# (jetpack::Store::test_backdate_last_used_at) for `cargo test`'s
# integration test binaries. Feature-gated so it is absent from a plain
# `cargo build`/release binary — see crates/jetpack/Cargo.toml.
[dev-dependencies]
jetpack = { path = "crates/jetpack", features = ["test-seam"] }
# D-DEP1: lifecycle HTTPS e2e (real rustls Server.bind/serve/shutdown) — test-only.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# D-DEP1: PEM load for the same test-only lifecycle HTTPS e2e peer.
rustls-pemfile = "2"
