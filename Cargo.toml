[package]
name = "jet"
version = "1.0.0"
edition = "2021"

# Invariant I6 (see CLAUDE.md): zero external dependencies in the compiler
# until the owner approves one. std only.

[lib]
name = "jet"
path = "Source/lib.rs"

[[bin]]
name = "jet"
path = "Source/main.rs"

# Jetpack — Jet's package manager (Phase 1). Built and tested independently
# from the `jet` binary (D-JPK1). std-only, like the rest of the compiler (I6).
[[bin]]
name = "jetpack"
path = "Source/Bin/Jetpack.rs"
