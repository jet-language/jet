# E4-JP9 native evaluator stop-line. These are resolved definition paths,
# enforced only where the crate enables Clippy's disallowed-* lints.
disallowed-types = [
  { path = "std::process::Command", reason = "native Nix evaluation cannot execute host processes" },
  { path = "std::process::Child", reason = "native Nix evaluation cannot execute host processes" },
  { path = "std::process::Stdio", reason = "native Nix evaluation cannot access host process I/O" },
  { path = "std::fs::File", reason = "native Nix evaluation requires explicit path authority" },
  { path = "std::fs::OpenOptions", reason = "native Nix evaluation requires explicit path authority" },
  { path = "std::net::TcpStream", reason = "native Nix evaluation requires explicit network authority" },
  { path = "std::net::TcpListener", reason = "native Nix evaluation requires explicit network authority" },
  { path = "std::net::UdpSocket", reason = "native Nix evaluation requires explicit network authority" },
  { path = "std::os::unix::net::UnixStream", reason = "native Nix evaluation cannot reach host services" },
  { path = "std::os::unix::net::UnixListener", reason = "native Nix evaluation cannot reach host services" },
  { path = "std::os::unix::net::UnixDatagram", reason = "native Nix evaluation cannot reach host services" },
  { path = "std::thread::Builder", reason = "native Nix evaluation uses evaluator-owned resource accounting" },
  { path = "std::time::SystemTime", reason = "native Nix evaluation cannot read ambient host time" },
]

