# E4-JP9 native evaluator stop-line. These are resolved definition paths,
# enforced only where the crate enables Clippy's disallowed-* lints.
disallowed-types = [
  { path = "std::process::Command", reason = "native Nix evaluation cannot execute host processes" },
  { path = "std::process::Child", reason = "native Nix evaluation cannot execute host processes" },
  { path = "std::process::ChildStdin", reason = "native Nix evaluation cannot access child processes" },
  { path = "std::process::ChildStdout", reason = "native Nix evaluation cannot access child processes" },
  { path = "std::process::ChildStderr", reason = "native Nix evaluation cannot access child processes" },
  { path = "std::process::Stdio", reason = "native Nix evaluation cannot access host process I/O" },
  { path = "std::process::Output", reason = "native Nix evaluation cannot execute host processes" },
  { path = "std::process::ExitStatus", reason = "native Nix evaluation cannot execute host processes" },
  { path = "std::os::unix::process::CommandExt", reason = "native Nix evaluation cannot execute host processes" },
  { path = "std::os::windows::process::CommandExt", reason = "native Nix evaluation cannot execute host processes", allow-invalid = true },
  { path = "std::net::TcpStream", reason = "native Nix evaluation cannot use network IPC" },
  { path = "std::net::TcpListener", reason = "native Nix evaluation cannot use network IPC" },
  { path = "std::net::UdpSocket", reason = "native Nix evaluation cannot use network IPC" },
  { path = "std::net::ToSocketAddrs", reason = "native Nix evaluation cannot resolve ambient network names" },
  { path = "std::os::unix::net::UnixStream", reason = "native Nix evaluation cannot use network IPC" },
  { path = "std::os::unix::net::UnixListener", reason = "native Nix evaluation cannot use network IPC" },
  { path = "std::os::unix::net::UnixDatagram", reason = "native Nix evaluation cannot use network IPC" },
  { path = "std::os::windows::net::UnixStream", reason = "native Nix evaluation cannot use network IPC", allow-invalid = true },
  { path = "std::os::windows::net::UnixListener", reason = "native Nix evaluation cannot use network IPC", allow-invalid = true },
]

disallowed-methods = [
  { path = "std::process::Command::new", reason = "native Nix evaluation cannot execute host processes" },
  { path = "std::process::exit", reason = "native Nix evaluation cannot control the host process" },
  { path = "std::process::abort", reason = "native Nix evaluation cannot control the host process" },
  { path = "std::net::TcpStream::connect", reason = "native Nix evaluation cannot use network IPC" },
  { path = "std::net::TcpListener::bind", reason = "native Nix evaluation cannot use network IPC" },
  { path = "std::net::UdpSocket::bind", reason = "native Nix evaluation cannot use network IPC" },
  { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "native Nix evaluation cannot resolve ambient network names" },
  { path = "std::os::unix::net::UnixStream::connect", reason = "native Nix evaluation cannot use network IPC" },
  { path = "std::os::unix::net::UnixStream::pair", reason = "native Nix evaluation cannot use network IPC" },
  { path = "std::os::unix::net::UnixListener::bind", reason = "native Nix evaluation cannot use network IPC" },
  { path = "std::os::unix::net::UnixDatagram::bind", reason = "native Nix evaluation cannot use network IPC" },
  { path = "std::os::unix::net::UnixDatagram::unbound", reason = "native Nix evaluation cannot use network IPC" },
  { path = "std::os::unix::net::UnixDatagram::pair", reason = "native Nix evaluation cannot use network IPC" },
  { path = "std::os::windows::net::UnixStream::connect", reason = "native Nix evaluation cannot use network IPC", allow-invalid = true },
  { path = "std::os::windows::net::UnixListener::bind", reason = "native Nix evaluation cannot use network IPC", allow-invalid = true },
]
