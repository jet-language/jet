<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tower.css">
</head>
<body>
<header class="topbar">
  <div class="topbar__mark">
    <span class="topbar__glyph">TOWER<b>.</b></span>
    <span class="topbar__sub" id="project-sub">project board</span>
  </div>
  <div class="topbar__feed" id="feed"></div>
  <div class="topbar__spacer"></div>
  <button class="topbar__pill" id="pill"></button>
</header>

<div class="deck">
  <nav class="rail" id="scope">
    <div class="rail__head">Views</div>
    <!-- nav buttons injected -->
    <div class="rail__foot" id="foot"></div>
  </nav>
  <main class="field" id="view" aria-live="polite"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="modal" id="detail" hidden role="dialog" aria-modal="true" aria-label="Card detail"></div>
<div class="focus" id="focus" hidden role="dialog" aria-modal="true" aria-label="Decision focus mode"></div>

<script type="module" src="tower.js?v=1"></script>
</body>
</html>
