<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060608">
<title>Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tower.css">
</head>
<body>

<!-- Beacon: one segment per thing blocked on the owner. Lit red = waiting on
     you; extinguishes as you clear it; fully dark = tower clear. -->
<aside class="beacon" id="beacon" aria-label="Blocked on you"></aside>

<div class="shell">
  <header class="top">
    <a class="top__mark" href="#now">TOWER<b>.</b></a>
    <span class="top__project" id="project-name"></span>
    <span class="top__feed" id="feed"></span>
    <button class="top__pill" id="pill"></button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Views"></nav>

  <main class="stage" id="view" aria-live="polite"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="modal" id="detail" hidden role="dialog" aria-modal="true" aria-label="Card detail"></div>
<div class="focus" id="focus" hidden role="dialog" aria-modal="true" aria-label="Decision focus mode"></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="tower.js?v=2"></script>
</body>
</html>
