<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jet browser surface</title>
  <style>
    :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
    body { max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
    form { display: grid; gap: .75rem; }
    label { display: grid; gap: .25rem; }
    button { width: fit-content; }
    #surface-status { padding: .5rem; border: 1px solid currentColor; }
  </style>
</head>
<body>
  <main>
    <h1>Browser surface</h1>
    <p id="surface-status" data-testid="surface-status">Ready</p>
    <form aria-label="Surface form">
      <label>Name <input name="name" placeholder="Type a name"></label>
      <label>Attachment <input name="attachment" type="file"></label>
      <label><input name="remember" type="checkbox"> Remember this surface</label>
      <button type="button">Apply</button>
      <a href="/browser_surface.html" download="browser-surface.html">Download this page</a>
    </form>
    <iframe title="Embedded surface" srcdoc="<p>Embedded surface</p>"></iframe>
  </main>
</body>
</html>
