# jetpack.toml — monorepo manifest (D-JPK-FILES, ratified 2026-06-18).
#
# Place this file at the repo root. It declares:
#   [repo]     — identity of this monorepo
#   [sources]  — named package sources (provider@target refs)
#   [packages] — optional explicit package index (falls back to find . -name pkg.jet)
#
# jetpack reads this before resolving any refs in env.jet.

[repo]
name = "jet-example-repo"
version = "0.1.0"

[sources]
# Named source refs used in env.jet and pkg.jet deps.
# Format: name = "provider@target" or "provider@target#version"
mine = "path@./jet-pkgs"
stable = "github@NixOS/nixpkgs/nixos-24.05"
unstable = "github@NixOS/nixpkgs/nixpkgs-unstable"

[packages]
# Explicit index mapping logical names to pkg.jet paths.
# If this table is absent, jetpack discovers packages by finding all pkg.jet files.
jet-pkgs = "jet-pkgs/pkg.jet"
