[package]
name = "forge"
version = "0.1.0"
jet = ">=0.1.0"
description = "A Nix-backed dev-environment & task runner, written in Jet"
license = "MIT OR Apache-2.0"
repository = ""

[dependencies]
ansi = { path = "packages/ansi" }
manifest = { path = "packages/manifest" }
taskrunner = { path = "packages/taskrunner" }
nixbridge = { path = "packages/nixbridge" }

[tool.forge]
env = "forge.env.jet"
manifest = "demo/forge.json"

