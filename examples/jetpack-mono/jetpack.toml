# jetpack.toml — multi-package monorepo example (D-JPK-FILES, Phase 2b).
#
# Two packages under packages/ — jetpack discovers them via find . -name pkg.jet.
# The [sources] block declares named sources that env.jet files in this repo
# can reference without repeating the upstream URL.

[repo]
name = "jet-mono-example"
version = "0.1.0"

[sources]
stable = "github@NixOS/nixpkgs/nixos-24.05"

[packages]
greeter = "packages/greeter/pkg.jet"
logger = "packages/logger/pkg.jet"
