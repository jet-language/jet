<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jet frontend mockups — viewer</title>
<style>
  :root {
    --ground: #0B1119; --raised: #16202E; --accent: #3FC6FF;
    --text: #D9E6F2; --sub: #7E93A8; --line: #223144;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ground); color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    flex: none; display: flex; flex-wrap: wrap; align-items: center;
    gap: 6px; padding: 8px 12px; background: var(--raised);
    border-bottom: 1px solid var(--line);
  }
  .title { font-weight: 600; margin-right: 10px; white-space: nowrap; }
  .title small { color: var(--sub); font-weight: 400; }
  nav.surfaces, nav.options { display: flex; flex-wrap: wrap; gap: 4px; }
  button {
    font: inherit; color: var(--text); background: transparent;
    border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.on { background: var(--accent); color: #04121d; border-color: var(--accent); font-weight: 600; }
  .bar2 {
    flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 6px 12px; background: var(--ground); border-bottom: 1px solid var(--line);
  }
  .bar2 .hint { color: var(--sub); margin-left: auto; white-space: nowrap; }
  .bar2 .hint kbd {
    font: 11px ui-monospace, monospace; background: var(--raised);
    border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px;
  }
  main { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane + .pane { border-left: 2px solid var(--line); }
  .pane .label {
    flex: none; padding: 3px 10px; font: 11px ui-monospace, monospace;
    color: var(--sub); background: var(--raised); border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center;
  }
  .pane .label b { color: var(--accent); font-weight: 600; }
  .pane .label select {
    font: inherit; color: var(--text); background: var(--ground);
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px;
  }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
<header>
  <span class="title">Jet frontend mockups <small>· v2 UX archetypes</small></span>
  <nav class="surfaces" id="surfaces" aria-label="Surface"></nav>
</header>
<div class="bar2">
  <nav class="options" id="options" aria-label="Archetype"></nav>
  <button id="cmp" title="Side-by-side compare">Compare: off</button>
  <button id="notes">NOTES</button>
  <button id="review">REVIEW</button>
  <span class="hint">
    <kbd>1</kbd>–<kbd>7</kbd> surface · <kbd>←</kbd><kbd>→</kbd> archetype · <kbd>c</kbd> compare
  </span>
</div>
<main id="main">
  <div class="pane" id="paneA">
    <div class="label"><b id="crumbA">—</b></div>
    <iframe id="frameA" title="mockup"></iframe>
  </div>
</main>
<script>
"use strict";
const DATA = {
  canvas:    ["workbench", "flow", "duallens", "guided", "hybrid"],
  studio:    ["settings", "changeset", "opsboard", "projectional", "hybrid"],
  repl:      ["line", "notebook", "workspace", "hybrid"],
  prompt:    ["minimal", "segments", "adaptive", "hybrid"],
  help:      ["palette", "browser", "tasks", "hybrid"],
  cli:       ["ledger", "live", "plan", "hybrid"],
  devserver: ["quiet", "dashboard", "paired", "hybrid"],
};
const surfaces = Object.keys(DATA);
let surf = location.hash.replace("#", "").split("/")[0] || "canvas";
if (!DATA[surf]) surf = "canvas";
let opt = location.hash.split("/")[1] || DATA[surf][0];
if (!DATA[surf].includes(opt)) opt = DATA[surf][0];
let compare = false, optB = null;

const $ = (id) => document.getElementById(id);

function render() {
  $("surfaces").innerHTML = surfaces.map((s, i) =>
    `<button data-s="${s}" class="${s === surf ? "on" : ""}">${i + 1} ${s}</button>`).join("");
  $("options").innerHTML = DATA[surf].map((o) =>
    `<button data-o="${o}" class="${o === opt ? "on" : ""}">${o}</button>`).join("");
  const src = `${surf}/${opt}.html`;
  if ($("frameA").getAttribute("src") !== src) $("frameA").setAttribute("src", src);
  $("crumbA").textContent = src;
  let paneB = $("paneB");
  if (compare) {
    optB = optB && DATA[surf].includes(optB) ? optB : (DATA[surf].find(o => o !== opt) || opt);
    if (!paneB) {
      paneB = document.createElement("div");
      paneB.className = "pane"; paneB.id = "paneB";
      paneB.innerHTML = `<div class="label">vs <select id="selB"></select></div>
                         <iframe id="frameB" title="compare mockup"></iframe>`;
      $("main").appendChild(paneB);
      paneB.querySelector("#selB").addEventListener("change", (e) => { optB = e.target.value; render(); });
    }
    const sel = paneB.querySelector("#selB");
    sel.innerHTML = DATA[surf].map(o => `<option ${o === optB ? "selected" : ""}>${o}</option>`).join("");
    const srcB = `${surf}/${optB}.html`;
    const fB = paneB.querySelector("#frameB");
    if (fB.getAttribute("src") !== srcB) fB.setAttribute("src", srcB);
  } else if (paneB) { paneB.remove(); optB = null; }
  $("cmp").textContent = `Compare: ${compare ? "on" : "off"}`;
  $("cmp").classList.toggle("on", compare);
  location.hash = `${surf}/${opt}`;
}

$("surfaces").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  surf = b.dataset.s; opt = DATA[surf][0]; optB = null; render();
});
$("options").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  opt = b.dataset.o; render();
});
$("cmp").addEventListener("click", () => { compare = !compare; render(); });
$("notes").addEventListener("click", () => window.open(`${surf}/NOTES.md`, "_blank"));
$("review").addEventListener("click", () => window.open("REVIEW.md", "_blank"));

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= surfaces.length) { surf = surfaces[n - 1]; opt = DATA[surf][0]; optB = null; render(); }
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    const list = DATA[surf], d = e.key === "ArrowRight" ? 1 : -1;
    opt = list[(list.indexOf(opt) + d + list.length) % list.length]; render();
  } else if (e.key === "c") { compare = !compare; render(); }
});
render();
</script>
</body>
</html>
