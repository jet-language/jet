<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jetos Studio — Operations</title>
<style>
:root{
  --ground:#0B1119; --panel:#16202E; --panel-2:#1B2838; --panel-3:#213249;
  --accent:#3FC6FF; --ok:#58D68D; --warn:#FFB454; --err:#FF5C5C;
  --text:#D9E6F2; --dim:#7E93A8; --line:#223247; --line-2:#2C4056;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}

.top{display:flex;align-items:center;gap:14px;height:54px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:650}.brand small{color:var(--dim);margin-left:6px;font-weight:500}
.top .live{margin-left:8px;display:inline-flex;align-items:center;gap:7px;color:var(--dim);font-size:12.5px}
.top .live .beat{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(88,214,141,.5);animation:beat 2s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(88,214,141,.5)}70%{box-shadow:0 0 0 7px rgba(88,214,141,0)}100%{box-shadow:0 0 0 0 rgba(88,214,141,0)}}
.top .right{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--dim);font-size:12.5px}

.page{padding:20px 24px 60px;max-width:1240px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.kpi .v{font-size:28px;font-weight:680;font-family:var(--mono);line-height:1}
.kpi .l{color:var(--dim);font-size:12.5px;margin-top:6px}
.kpi.alert{border-color:rgba(255,92,92,.4);background:linear-gradient(180deg,rgba(255,92,92,.06),var(--panel))}
.kpi.alert .v{color:var(--err)}
.kpi.ok .v{color:var(--ok)}
.kpi.warn .v{color:var(--warn)}

.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.sect{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.sect>h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sect>h2 .cnt{margin-left:auto;font-family:var(--mono);color:var(--text)}

/* alerts */
.alert-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:15px 18px;border-top:1px solid var(--line)}
.alert-row:first-of-type{border-top:0}
.sev{width:10px;height:10px;border-radius:50%;margin-top:5px}
.sev.err{background:var(--err)}.sev.warn{background:var(--warn)}
.alert-row .host{font-family:var(--mono);font-size:12px;color:var(--dim)}
.alert-row .msg{font-weight:550;margin:2px 0}
.alert-row .msg .code{color:var(--err);font-family:var(--mono);font-size:12px}
.alert-row .acts{display:flex;gap:8px;flex-shrink:0}
.btn{padding:7px 13px;border-radius:6px;border:1px solid var(--line-2);background:var(--panel-2);font-weight:550;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#04121c;border-color:var(--accent)}
.btn.danger{background:transparent;border-color:rgba(255,92,92,.5);color:#ffb3b3}
.btn.danger:hover{background:rgba(255,92,92,.12);border-color:var(--err)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:transparent}

/* hosts */
.host-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0}
.host-row:first-of-type{border-top:0}
.host-row:hover{background:var(--panel-2)}
.state{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;font-size:16px}
.state.ok{background:rgba(88,214,141,.14);color:var(--ok)}
.state.warn{background:rgba(255,180,84,.14);color:var(--warn)}
.state.err{background:rgba(255,92,92,.14);color:var(--err)}
.host-row .name{font-weight:600}
.host-row .name .role{color:var(--dim);font-weight:500;font-size:12px;margin-left:8px}
.host-row .sub{color:var(--dim);font-size:12.5px;margin-top:2px}
.host-row .sub .mono{color:var(--text)}
.ribbon{display:flex;gap:3px;align-items:center}
.ribbon i{width:9px;height:16px;border-radius:2px;background:var(--line-2)}
.ribbon i.ok{background:var(--ok)}.ribbon i.err{background:var(--err)}.ribbon i.cur{outline:1.5px solid var(--accent);outline-offset:1px}
.ribbon .lab{font-size:11px;color:var(--dim);margin-left:8px}

/* services grid */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line)}
.svc{background:var(--panel);padding:12px 14px}
.svc .n{font-weight:550;display:flex;align-items:center;gap:8px}
.svc .n .d{width:8px;height:8px;border-radius:50%}
.svc .n .d.ok{background:var(--ok)}.svc .n .d.err{background:var(--err)}.svc .n .d.warn{background:var(--warn)}
.svc .m{color:var(--dim);font-size:12px;margin-top:4px;font-family:var(--mono)}
.svc .host{color:var(--dim);font-size:11px;margin-top:2px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(4,8,14,.55);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,94vw);background:var(--panel);border-left:1px solid var(--line-2);transform:translateX(100%);transition:transform .24s ease;z-index:21;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.drawer.show{transform:none}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer .dh .state{flex-shrink:0}
.drawer .dh h3{margin:0;font-size:17px}
.drawer .dh .sub{color:var(--dim);font-size:12.5px}
.drawer .dh .close{margin-left:auto;background:transparent;border:1px solid var(--line-2);border-radius:6px;width:32px;height:32px}
.drawer .db{overflow:auto;padding:18px 20px 40px;flex:1}
.dcard{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.dcard h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
.diag{border-left:3px solid var(--err);padding:2px 0 2px 14px;margin:0}
.diag .what{font-weight:600}
.diag .why{color:var(--dim);font-size:13px;margin-top:4px}
.diag .fix{color:var(--text);font-size:13px;margin-top:8px}
.diag .fix b{color:var(--accent)}
.optline{font-family:var(--mono);font-size:12.5px;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0;white-space:pre-wrap}
.optline .del{color:var(--err)}.optline .add{color:var(--ok)}
.gentl{display:flex;flex-direction:column;gap:8px}
.gtl-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.gtl-row:first-child{border-top:0}
.gtl-num{font-family:var(--mono);font-weight:600}
.gtl-row.cur .gtl-num{color:var(--accent)}
.gtl-row.failed .gtl-num{color:var(--err);text-decoration:line-through}
.gtl-meta{color:var(--dim);font-size:12px}
.badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;margin-left:6px}
.badge.good{background:rgba(88,214,141,.14);color:var(--ok)}
.badge.failed{background:rgba(255,92,92,.14);color:var(--err)}
.drawer .foot{border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;align-items:center}
.drawer .foot .note{color:var(--dim);font-size:12px}
.drawer .foot .sp{margin-left:auto;display:flex;gap:10px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--panel-3);border:1px solid var(--line-2);border-left:3px solid var(--ok);border-radius:6px;padding:12px 18px;box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0;transition:.2s;max-width:420px;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{display:block;margin-bottom:2px}.toast small{color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <span class="brand">jetos Studio <small>operations</small></span>
  <span class="live"><span class="beat"></span> live · fleet home</span>
  <div class="right"><span>refreshed just now</span><button class="btn sm ghost">Refresh</button></div>
</header>

<div class="page">
  <div class="kpis" id="kpis"></div>

  <section class="sect" id="alertsSect">
    <h2>Needs attention <span class="cnt" id="alertCnt"></span></h2>
    <div id="alerts"></div>
  </section>

  <div class="cols">
    <section class="sect">
      <h2>Hosts <span class="cnt" id="hostCnt"></span></h2>
      <div id="hosts"></div>
    </section>
    <section class="sect">
      <h2>Services</h2>
      <div class="svc-grid" id="svcs"></div>
    </section>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Host detail" role="dialog" aria-modal="true">
  <div class="dh" id="drawerHead"></div>
  <div class="db" id="drawerBody"></div>
  <div class="foot" id="drawerFoot"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------------------------------------------------------------
   jetos Studio — operations (dashboard-first).
   Core loop: watch the fleet health board; when a tile goes red,
   drill into the misbehaving host/service, fix it or roll back from
   the drawer, and watch the board go green.  Editing config is a
   drill-in action, not the landing screen — you operate many machines
   and edit rarely.
----------------------------------------------------------------*/

const HOSTS = [
  {id:"halcyon", role:"workstation", state:"err", gen:41, tried:42,
   sub:"kernel boot failed · fell back to 41", uptime:"2h", target:"linux.x64",
   ribbon:[{n:38,ok:1},{n:39,ok:1},{n:40,ok:1},{n:41,ok:1,cur:1},{n:42,err:1}],
   drift:"config ahead of running — generation 42 not booting"},
  {id:"forge", role:"build server", state:"ok", gen:18, sub:"all services healthy", uptime:"34d", target:"linux.x64",
   ribbon:[{n:15,ok:1},{n:16,ok:1},{n:17,ok:1},{n:18,ok:1,cur:1}], drift:"in sync"},
  {id:"edge-02", role:"gateway", state:"warn", gen:7, sub:"backup service failed last run", uptime:"12d", target:"linux.arm64",
   ribbon:[{n:4,ok:1},{n:5,ok:1},{n:6,ok:1},{n:7,ok:1,cur:1}], drift:"in sync"},
];

const SERVICES = [
  {host:"halcyon", name:"sshd", state:"ok", m:"active · 22"},
  {host:"halcyon", name:"pipewire", state:"ok", m:"active"},
  {host:"halcyon", name:"plasma", state:"ok", m:"active"},
  {host:"halcyon", name:"metrics", state:"ok", m:"active · :9999"},
  {host:"forge", name:"sshd", state:"ok", m:"active · 22"},
  {host:"forge", name:"buildd", state:"ok", m:"active"},
  {host:"edge-02", name:"sshd", state:"ok", m:"active · 22"},
  {host:"edge-02", name:"nftables", state:"ok", m:"active"},
  {host:"edge-02", name:"backup", state:"err", m:"exit 1 · 06:00"},
];

const ALERTS = [
  {sev:"err", host:"halcyon", code:"boot: generation 42 did not come up",
   msg:"Kernel from generation 42 failed to boot; the machine fell back to generation 41 automatically.",
   drill:"halcyon", primary:{label:"Roll back cleanly to 41", act:"rollback"}, secondary:{label:"Inspect kernel", act:"drill"}},
  {sev:"warn", host:"edge-02", code:"service backup: exit 1",
   msg:"The backup service failed its last scheduled run at 06:00.",
   drill:"edge-02", primary:{label:"Restart service", act:"restart"}, secondary:{label:"View host", act:"drill"}},
];

// per-host drill detail
const DETAIL = {
  halcyon:{
    diag:{what:"Generation 42 did not boot.", why:"Generation 42 set boot.kernel.profile to .Latest, which shipped a kernel your GPU driver can't bind. The bootloader tried it once, timed out, and booted the previous good generation.",
      fix:"Roll back to generation 41 to stay on the working kernel, or change the profile back and rebuild."},
    optDiff:{key:"boot.kernel.profile", from:".CachyOSLatest", to:".Latest"},
    gens:[
      {n:42,failed:true,when:"tried 2h ago",note:"failed"},
      {n:41,cur:true,good:true,when:"running · switched 3d ago",note:"good"},
      {n:40,good:true,when:"6d ago"},
      {n:39,when:"9d ago"},
    ]},
  "edge-02":{
    diag:{what:"backup service exited 1.", why:"The backup timer ran at 06:00 and the exec command returned a non-zero status. The unit is loaded but its last run failed.",
      fix:"Restart the service to retry now, or open the service to change its exec or schedule."},
    optDiff:null,
    gens:[{n:7,cur:true,good:true,when:"running · 12d"},{n:6,good:true,when:"20d ago"}]},
  forge:{
    diag:null, optDiff:null,
    gens:[{n:18,cur:true,good:true,when:"running · 34d"},{n:17,good:true,when:"41d ago"}]},
};

const GLYPH={ok:"✓",warn:"!",err:"✕"};

function renderKpis(){
  const healthy=HOSTS.filter(h=>h.state==="ok").length;
  const svcUp=SERVICES.filter(s=>s.state==="ok").length;
  const alerts=ALERTS.length;
  const errAlerts=ALERTS.filter(a=>a.sev==="err").length;
  const cards=[
    {v:HOSTS.length, l:"hosts in fleet", cls:""},
    {v:`${healthy}/${HOSTS.length}`, l:"hosts healthy", cls:healthy===HOSTS.length?"ok":"warn"},
    {v:`${svcUp}/${SERVICES.length}`, l:"services up", cls:svcUp===SERVICES.length?"ok":"warn"},
    {v:alerts, l:alerts?"need attention":"all clear", cls:errAlerts?"alert":alerts?"warn":"ok"},
  ];
  document.getElementById("kpis").innerHTML=cards.map(c=>`<div class="kpi ${c.cls}"><div class="v">${c.v}</div><div class="l">${c.l}</div></div>`).join("");
}

function renderAlerts(){
  document.getElementById("alertCnt").textContent=ALERTS.length;
  const el=document.getElementById("alerts");
  if(!ALERTS.length){el.innerHTML=`<div style="padding:22px 18px;color:var(--dim)">Nothing needs attention. Every host is running its target generation with all services healthy.</div>`;document.getElementById("alertsSect").style.borderColor="var(--line)";return;}
  el.innerHTML=ALERTS.map((a,i)=>`<div class="alert-row">
    <span class="sev ${a.sev}"></span>
    <div><div class="host">${a.host}</div><div class="msg">${a.msg}</div><div class="msg code">${a.code}</div></div>
    <div class="acts">
      <button class="btn ${a.sev==="err"?"danger":""}" data-alert="${i}" data-act="${a.primary.act}">${a.primary.label}</button>
      <button class="btn ghost sm" data-alert="${i}" data-act="${a.secondary.act}">${a.secondary.label}</button>
    </div></div>`).join("");
  el.querySelectorAll("[data-alert]").forEach(b=>b.onclick=()=>{
    const a=ALERTS[+b.dataset.alert];
    if(b.dataset.act==="rollback")quickRollback(a.host);
    else if(b.dataset.act==="restart")restart(a.host);
    else openDrawer(a.drill);
  });
}

function renderHosts(){
  document.getElementById("hostCnt").textContent=HOSTS.length;
  document.getElementById("hosts").innerHTML=HOSTS.map(h=>{
    const rib=h.ribbon.map(g=>`<i class="${g.err?"err":g.ok?"ok":""} ${g.cur?"cur":""}" title="generation ${g.n}"></i>`).join("");
    return `<button class="host-row" data-host="${h.id}">
      <span class="state ${h.state}">${GLYPH[h.state]}</span>
      <div><div class="name">${h.id}<span class="role">${h.role} · ${h.target}</span></div>
        <div class="sub">generation <span class="mono">${h.gen}</span> · up ${h.uptime} · ${h.sub}</div></div>
      <div class="ribbon">${rib}<span class="lab">gen 42</span></div>
    </button>`;
  }).join("");
  document.getElementById("hosts").querySelectorAll(".host-row").forEach(b=>b.onclick=()=>openDrawer(b.dataset.host));
}

function renderSvcs(){
  document.getElementById("svcs").innerHTML=SERVICES.map(s=>`<div class="svc">
    <div class="n"><span class="d ${s.state}"></span>${s.name}</div>
    <div class="m">${s.m}</div><div class="host">${s.host}</div></div>`).join("");
}

/* ---- drill-in drawer ---- */
function openDrawer(hostId){
  const h=HOSTS.find(x=>x.id===hostId);const d=DETAIL[hostId]||{};
  document.getElementById("drawerHead").innerHTML=`
    <span class="state ${h.state}">${GLYPH[h.state]}</span>
    <div><h3>${h.id}</h3><div class="sub">${h.role} · ${h.target} · generation ${h.gen}</div></div>
    <button class="close" id="drawerClose" aria-label="Close">✕</button>`;

  let body="";
  if(d.diag){
    body+=`<div class="dcard"><h4>What's wrong</h4>
      <div class="diag"><div class="what">${d.diag.what}</div><div class="why">${d.diag.why}</div>
      <div class="fix">Fix: ${d.diag.fix.replace("Roll back","<b>Roll back</b>")}</div></div>`;
    if(d.optDiff) body+=`<div class="optline"><span class="del">- ${d.optDiff.key}: ${d.optDiff.from}</span>
<span class="add">+ ${d.optDiff.key}: ${d.optDiff.to}</span>   ← generation 42 changed this</div>`;
    body+=`</div>`;
  } else {
    body+=`<div class="dcard"><h4>Status</h4><div style="color:var(--ok)">Healthy. Running its target generation with all services active.</div></div>`;
  }
  body+=`<div class="dcard"><h4>Generations</h4><div class="gentl">${(d.gens||[]).map(g=>{
    const cls=g.failed?"failed":g.cur?"cur":"";
    const badge=g.failed?`<span class="badge failed">did not boot</span>`:g.cur?`<span class="badge good">running</span>`:g.good?`<span class="badge good">good</span>`:"";
    const act=g.cur?"":g.failed?`<button class="btn sm ghost" disabled>failed</button>`:`<button class="btn sm" data-rollto="${g.n}">Roll back</button>`;
    return `<div class="gtl-row ${cls}"><span class="gtl-num">${g.n}</span><span class="gtl-meta">${g.when} ${badge}</span><span>${act}</span></div>`;
  }).join("")}</div></div>`;

  body+=`<div class="dcard"><h4>Edit config</h4><div style="color:var(--dim);font-size:13px">Change this host's options directly. Each edit is a set-option transaction that writes one line of its source and builds a new generation.</div>
    <div style="margin-top:12px;display:flex;gap:8px"><button class="btn sm" data-edit="boot.kernel">Kernel &amp; boot</button><button class="btn sm" data-edit="services">Services</button><button class="btn sm" data-edit="all">All options</button></div></div>`;

  document.getElementById("drawerBody").innerHTML=body;

  const foot=document.getElementById("drawerFoot");
  if(h.state==="err"){
    foot.innerHTML=`<span class="note">Generation 41 is confirmed good.</span><span class="sp"><button class="btn danger" data-rollto="41">Roll back to 41 &amp; reboot</button></span>`;
  } else if(h.state==="warn"){
    foot.innerHTML=`<span class="note">Retry without a rebuild.</span><span class="sp"><button class="btn" id="restartBtn">Restart failed service</button></span>`;
  } else {
    foot.innerHTML=`<span class="note">Nothing to fix.</span><span class="sp"><button class="btn ghost" id="drawerOk">Close</button></span>`;
  }

  document.getElementById("drawerBody").querySelectorAll("[data-rollto]").forEach(b=>b.onclick=()=>{quickRollback(h.id,+b.dataset.rollto);});
  document.getElementById("drawerBody").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>toast("Opening editor",`Config editor for ${h.id} · ${b.dataset.edit}. From here Studio writes the source line and rebuilds.`,"ok"));
  foot.querySelectorAll("[data-rollto]").forEach(b=>b.onclick=()=>quickRollback(h.id,+b.dataset.rollto));
  const rb=document.getElementById("restartBtn");if(rb)rb.onclick=()=>restart(h.id);
  const ok=document.getElementById("drawerOk");if(ok)ok.onclick=closeDrawer;
  document.getElementById("drawerClose").onclick=closeDrawer;

  document.getElementById("scrim").classList.add("show");
  document.getElementById("drawer").classList.add("show");
  document.getElementById("drawerClose").focus();
}
function closeDrawer(){document.getElementById("scrim").classList.remove("show");document.getElementById("drawer").classList.remove("show");}
document.getElementById("scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});

/* ---- ops actions that heal the board ---- */
function quickRollback(hostId,to){
  const h=HOSTS.find(x=>x.id===hostId);
  to=to||41;
  h.state="ok";h.gen=to;h.sub=`rolled back to ${to} · confirmed good`;h.ribbon=h.ribbon.filter(g=>!g.err);
  const ai=ALERTS.findIndex(a=>a.host===hostId);if(ai>=0)ALERTS.splice(ai,1);
  refresh();closeDrawer();
  toast("Rolled back",`${hostId} is back on generation ${to} and healthy. The failed generation stays in history for inspection.`,"ok");
}
function restart(hostId){
  const s=SERVICES.find(x=>x.host===hostId&&x.state==="err");if(s){s.state="ok";s.m="active · restarted";}
  const h=HOSTS.find(x=>x.id===hostId);if(h){h.state="ok";h.sub="all services healthy";}
  const ai=ALERTS.findIndex(a=>a.host===hostId);if(ai>=0)ALERTS.splice(ai,1);
  refresh();closeDrawer();
  toast("Service restarted",`${hostId}: backup is active again. No rebuild needed.`,"ok");
}

function refresh(){renderKpis();renderAlerts();renderHosts();renderSvcs();}
function toast(title,msg,kind){
  const t=document.getElementById("toast");
  t.style.borderLeftColor=kind==="ok"?"var(--ok)":kind==="warn"?"var(--warn)":"var(--err)";
  t.innerHTML=`<b>${title}</b><small>${msg}</small>`;t.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),4600);
}
refresh();
</script>
</body>
</html>
