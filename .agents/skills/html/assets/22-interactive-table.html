<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Acme — User Directory</title>
<style>
/* html skill — canonical theme. Paste this block inline at the top of the page's single style element; never load it as an external stylesheet.
   Palette: jet black and signal red. Voice: an instrument panel — dark and quiet when healthy, red only where attention belongs. */

:root {
  /* palette */
  --jet:      #060606;   /* page background: the material itself, not charcoal */
  --soot:     #111111;   /* panels */
  --ash:      #1A1A1A;   /* raised cards, code blocks, inputs */
  --seam:     #262626;   /* borders and rules */
  --bone:     #EFEAE2;   /* primary text: warm off-white, never pure white */
  --bone-dim: #BDB7AE;   /* secondary text */
  --smoke:    #8E8A83;   /* captions, legends, muted values */
  --ember:    #FF3D2E;   /* the one saturated color: emphasis, live, critical, links, the ignition line */
  --oxblood:  #6E1B14;   /* deep red surfaces: selected rows, attention fills, low-emphasis series */
  --ember-glow: rgba(255, 61, 46, 0.18);
  --oxblood-tint: rgba(110, 27, 20, 0.35);

  /* type: monospace placards for display and legends, a quiet humanist sans for reading */
  --display: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --body:    "Avenir Next", Avenir, "Segoe UI Variable", "Segoe UI", system-ui, Roboto, "Helvetica Neue", sans-serif;
  --label:   var(--display);

  /* geometry and motion */
  --page: 1080px;
  --radius: 6px;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}

* { box-sizing: border-box; }
html { background: var(--jet); color-scheme: dark; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--jet);
  color: var(--bone);
  font: 15.5px/1.6 var(--body);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--ember); text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
a:hover { color: var(--bone); }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
::selection { background: var(--oxblood); color: var(--bone); }
code, kbd, pre { font-family: var(--label); }
code { font-size: 0.9em; color: var(--bone); }
pre { margin: 0; padding: 16px 18px; overflow-x: auto; background: var(--ash); border: 1px solid var(--seam); border-radius: var(--radius); font-size: 13px; line-height: 1.55; }

.page { max-width: var(--page); margin: 0 auto; padding: 56px 32px 96px; }

/* header: legend line, placard title, ignition line, one-sentence thesis */
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0; color: var(--smoke); font: 600 11px/1.6 var(--label); letter-spacing: 0.12em; text-transform: uppercase; }
.legend .live::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 8px var(--ember); vertical-align: middle; animation: lamp 2.4s ease-in-out infinite; }
h1 { margin: 20px 0 0; font: 700 clamp(40px, 6vw, 64px)/0.95 var(--display); letter-spacing: -0.04em; color: var(--bone); }
.ignition { height: 2px; margin: 24px 0 0; background: var(--ember); transform-origin: left center; animation: ignite 0.8s var(--ease) 0.2s both; }
.thesis { max-width: 62ch; margin: 20px 0 0; color: var(--bone-dim); font-size: 17px; line-height: 1.5; }
.rise { animation: rise 0.6s var(--ease) both; }
.rise:nth-child(2) { animation-delay: 0.08s; }
.rise:nth-child(3) { animation-delay: 0.16s; }
.rise:nth-child(4) { animation-delay: 0.24s; }

/* sections: a tick that lights when the section arrives */
section { margin: 56px 0 0; }
.section-head { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; }
.section-head::before { content: ""; flex: none; width: 18px; height: 2px; background: var(--ember); opacity: 0.35; transition: opacity 0.4s var(--ease); }
.is-visible > .section-head::before, .section-head.is-visible::before { opacity: 1; }
h2 { margin: 0; font: 600 24px/1.2 var(--display); letter-spacing: -0.02em; }
h3 { margin: 24px 0 8px; font: 600 16px/1.3 var(--display); letter-spacing: -0.01em; }
.eyebrow { margin: 0 0 8px; color: var(--smoke); font: 600 11px/1.6 var(--label); letter-spacing: 0.12em; text-transform: uppercase; }
.js .reveal { opacity: 0; transform: translateY(10px); transition: opacity 0.5s var(--ease), transform 0.5s var(--ease); }
.js .reveal.is-visible { opacity: 1; transform: none; }

/* surfaces */
.panel { padding: 20px 24px; background: var(--soot); border: 1px solid var(--seam); border-radius: var(--radius); }
.card { padding: 16px 18px; background: var(--ash); border: 1px solid var(--seam); border-left: 2px solid transparent; border-radius: var(--radius); transition: border-color 0.2s var(--ease); }
.card:hover { border-color: var(--oxblood); border-left-color: var(--ember); }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

/* status: quiet by default; red only for attention */
.status { display: inline-flex; align-items: center; gap: 8px; padding: 3px 9px; border: 1px solid var(--seam); border-radius: 3px; color: var(--bone); font: 600 11px/1.4 var(--label); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
.status.attention { background: var(--oxblood); border-color: var(--oxblood); }
.status.critical { background: var(--ember); border-color: var(--ember); color: var(--jet); }
.status.muted { color: var(--smoke); }

/* numbers: big values are placards */
.value { font: 700 clamp(28px, 4vw, 40px)/1 var(--display); letter-spacing: -0.03em; color: var(--bone); }
.value.attention { color: var(--ember); }

/* tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--seam); border-radius: var(--radius); background: var(--soot); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { padding: 10px 14px; border-bottom: 1px solid var(--seam); color: var(--smoke); font: 600 11px/1.4 var(--label); letter-spacing: 0.1em; text-transform: uppercase; text-align: left; white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--seam); color: var(--bone-dim); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--ash); }
tr.selected td { background: var(--oxblood-tint); }

/* controls */
button, .button { padding: 8px 14px; background: var(--ash); border: 1px solid var(--seam); border-radius: 4px; color: var(--bone); font: 600 12px/1.2 var(--label); letter-spacing: 0.06em; cursor: pointer; transition: border-color 0.2s var(--ease), background 0.2s var(--ease); }
button:hover, .button:hover { border-color: var(--ember); }
button.active, button[aria-pressed="true"] { background: var(--oxblood); border-color: var(--oxblood); }
input, select, textarea { padding: 9px 12px; background: var(--ash); border: 1px solid var(--seam); border-radius: 4px; color: var(--bone); font: 14px/1.4 var(--body); }
input::placeholder, textarea::placeholder { color: var(--smoke); }

/* diffs: removed is oxblood, added is bone; no green */
.diff-add { background: rgba(239, 234, 226, 0.06); }
.diff-del { background: var(--oxblood-tint); }

footer { margin-top: 72px; padding-top: 16px; border-top: 1px solid var(--seam); color: var(--smoke); font: 12px/1.6 var(--label); }

@keyframes ignite { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes lamp { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

@media (max-width: 900px) { .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) {
  .page { padding: 40px 18px 72px; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  h1 { font-size: clamp(32px, 11vw, 44px); }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .ignition, .rise, .legend .live::before { animation: none; }
  .js .reveal { opacity: 1; transform: none; transition: none; }
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}


/* directory layout */
.directory { margin-top: 4px; }
.section-head { justify-content: space-between; }
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.search-wrap { flex: 1; min-width: 220px; max-width: 380px; position: relative; }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--smoke); pointer-events: none; display: flex; align-items: center; }
.search-box { width: 100%; padding: 10px 14px 10px 38px; }
.search-box:focus { border-color: var(--ember); }
.filter-pills { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--seam); border-radius: 4px; background: var(--soot); }
.filter-btn { border: 0; padding: 7px 12px; }
.filter-btn[aria-pressed="true"] { background: var(--oxblood); border-color: var(--oxblood); }
.table-wrap { overflow: hidden; }
.table-scroll { overflow-x: auto; }
th { cursor: pointer; position: relative; user-select: none; }
th[aria-sort="ascending"], th[aria-sort="descending"] { color: var(--bone); }
th .sort-arrow { margin-left: 4px; color: var(--smoke); font-size: 9px; }
th.sorted .sort-arrow { color: var(--ember); }
td { vertical-align: middle; }
tbody tr:hover td { background: var(--ash); }
.user-cell { display: flex; align-items: center; gap: 12px; min-width: 220px; }
.avatar { width: 34px; height: 34px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--jet); font: 600 12px/1 var(--label); position: relative; }
.avatar-ember { background: var(--ember); }
.avatar-bone { background: var(--bone); }
.avatar-smoke { background: var(--smoke); }
.avatar-oxblood { background: var(--oxblood); color: var(--bone); }
.avatar-status { position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border: 2px solid var(--ash); border-radius: 50%; }
.status-online { background: var(--bone); }
.status-away { background: var(--smoke); }
.user-name { color: var(--bone); font-weight: 600; font-size: 14px; }
.user-email { margin-top: 1px; color: var(--smoke); font: 11px/1.4 var(--label); }
.role-chip { min-width: 68px; justify-content: center; }
.badge-dot { display: none; }
.mono, .team-badge { color: var(--bone-dim); font: 12px/1.4 var(--label); }
.pagination { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--seam); background: var(--soot); color: var(--smoke); }
.pagination-info { font: 11px/1.4 var(--label); }
.page-btns { display: flex; gap: 4px; }
.page-btn { min-width: 32px; height: 32px; padding: 0 8px; }
@media (max-width: 640px) { .toolbar { align-items: stretch; } .search-wrap { max-width: none; } .filter-pills { justify-content: space-between; } .filter-btn { flex: 1; padding-inline: 8px; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <p class="legend rise"><span class="live">Live</span><span>Source · Acme Platform</span><span>March 2026</span></p>
    <h1 class="rise">User directory</h1>
    <div class="ignition"></div>
    <p class="thesis rise">Team members and their access levels across the Acme platform; click column headers to sort.</p>
  </header>

  <section class="reveal directory">
    <div class="section-head"><h2>Members</h2><span class="status muted" id="count">12 members</span></div>
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
        <input class="search-box" type="text" placeholder="Search by name or email..." id="search" aria-label="Search by name or email">
      </div>
      <div class="filter-pills" aria-label="Filter by role">
        <button type="button" class="filter-btn" data-role="all" aria-pressed="true">All</button>
        <button type="button" class="filter-btn" data-role="admin" aria-pressed="false">Admin</button>
        <button type="button" class="filter-btn" data-role="editor" aria-pressed="false">Editor</button>
        <button type="button" class="filter-btn" data-role="viewer" aria-pressed="false">Viewer</button>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th scope="col" data-key="name" tabindex="0" role="button" aria-sort="none">Name <span class="sort-arrow">↕</span></th>
              <th scope="col" data-key="role" tabindex="0" role="button" aria-sort="none">Role <span class="sort-arrow">↕</span></th>
              <th scope="col" data-key="team" tabindex="0" role="button" aria-sort="none">Team <span class="sort-arrow">↕</span></th>
              <th scope="col" data-key="joined" tabindex="0" role="button" aria-sort="none">Joined <span class="sort-arrow">↕</span></th>
              <th scope="col" data-key="lastActive" tabindex="0" role="button" aria-sort="none">Last active <span class="sort-arrow">↕</span></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="pagination">
        <span class="pagination-info">Showing 1-12 of 12</span>
        <div class="page-btns"><button type="button" class="page-btn active" aria-current="page">1</button></div>
      </div>
    </div>
  </section>
</div>
<script>
const DATA = [
  { name: "Alice Chen", email: "alice@acme.dev", role: "admin", team: "Platform", joined: "2024-01-15", lastActive: "2026-03-21", tone: "avatar-ember", status: "online" },
  { name: "Bob Martinez", email: "bob@acme.dev", role: "editor", team: "Frontend", joined: "2024-03-08", lastActive: "2026-03-20", tone: "avatar-bone", status: "online" },
  { name: "Carol Wu", email: "carol@acme.dev", role: "admin", team: "Backend", joined: "2024-02-22", lastActive: "2026-03-21", tone: "avatar-smoke", status: "online" },
  { name: "Dan Park", email: "dan@acme.dev", role: "viewer", team: "Design", joined: "2025-06-10", lastActive: "2026-03-18", tone: "avatar-oxblood", status: "away" },
  { name: "Eva Lindstrom", email: "eva@acme.dev", role: "editor", team: "Frontend", joined: "2024-09-01", lastActive: "2026-03-19", tone: "avatar-ember", status: "online" },
  { name: "Frank Obi", email: "frank@acme.dev", role: "viewer", team: "Marketing", joined: "2025-11-20", lastActive: "2026-03-15", tone: "avatar-bone", status: "away" },
  { name: "Grace Liu", email: "grace@acme.dev", role: "admin", team: "Platform", joined: "2024-01-15", lastActive: "2026-03-21", tone: "avatar-smoke", status: "online" },
  { name: "Hassan Ali", email: "hassan@acme.dev", role: "editor", team: "Backend", joined: "2024-07-14", lastActive: "2026-03-21", tone: "avatar-oxblood", status: "online" },
  { name: "Ines Rivera", email: "ines@acme.dev", role: "viewer", team: "Design", joined: "2025-08-03", lastActive: "2026-03-14", tone: "avatar-ember", status: "away" },
  { name: "Jake Thompson", email: "jake@acme.dev", role: "editor", team: "Platform", joined: "2024-05-19", lastActive: "2026-03-20", tone: "avatar-bone", status: "online" },
  { name: "Kira Novak", email: "kira@acme.dev", role: "viewer", team: "Marketing", joined: "2025-12-01", lastActive: "2026-03-17", tone: "avatar-smoke", status: "away" },
  { name: "Leo Sato", email: "leo@acme.dev", role: "admin", team: "Backend", joined: "2024-04-11", lastActive: "2026-03-21", tone: "avatar-oxblood", status: "online" }
];

const roleClasses = { admin: "status attention", editor: "status", viewer: "status" };
let sortKey = null;
let sortDir = 1;
let filterRole = "all";
let searchQ = "";

function updateSortHeaders() {
  document.querySelectorAll("th[data-key]").forEach((th) => {
    const active = th.dataset.key === sortKey;
    th.classList.toggle("sorted", active);
    th.setAttribute("aria-sort", active ? (sortDir === 1 ? "ascending" : "descending") : "none");
    th.querySelector(".sort-arrow").textContent = active ? (sortDir === 1 ? "▲" : "▼") : "↕";
  });
}

function sortBy(th) {
  const key = th.dataset.key;
  if (sortKey === key) sortDir *= -1;
  else { sortKey = key; sortDir = 1; }
  updateSortHeaders();
  render();
}

function render() {
  let rows = DATA.filter((r) => {
    if (filterRole !== "all" && r.role !== filterRole) return false;
    if (searchQ && !(r.name.toLowerCase().includes(searchQ) || r.email.toLowerCase().includes(searchQ))) return false;
    return true;
  });
  if (sortKey) rows.sort((a, b) => (a[sortKey] < b[sortKey] ? -1 : a[sortKey] > b[sortKey] ? 1 : 0) * sortDir);
  document.getElementById("tbody").innerHTML = rows.map((r) =>
    '<tr><td><div class="user-cell"><div class="avatar ' + r.tone + '">' + r.name.split(" ").map((w) => w[0]).join("") + '<span class="avatar-status status-' + r.status + '"></span></div><div class="user-info"><div class="user-name">' + r.name + '</div><div class="user-email">' + r.email + '</div></div></div></td><td><span class="role-chip ' + roleClasses[r.role] + '">' + r.role + '</span></td><td><span class="team-badge">' + r.team + '</span></td><td class="mono">' + r.joined + '</td><td class="mono">' + r.lastActive + '</td></tr>'
  ).join("");
  document.getElementById("count").textContent = rows.length + " member" + (rows.length !== 1 ? "s" : "");
}

document.getElementById("search").addEventListener("input", (e) => { searchQ = e.target.value.toLowerCase(); render(); });
document.querySelectorAll(".filter-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    filterRole = btn.dataset.role;
    document.querySelectorAll(".filter-btn").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
    render();
  });
});
document.querySelectorAll("th[data-key]").forEach((th) => {
  th.addEventListener("click", () => sortBy(th));
  th.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sortBy(th); }
  });
});

render();
updateSortHeaders();

const els = document.querySelectorAll('.reveal, section');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce || !('IntersectionObserver' in window)) { els.forEach((e) => e.classList.add('is-visible')); }
else {
  document.documentElement.classList.add('js');
  const io = new IntersectionObserver((entries) => {
    for (const en of entries) if (en.isIntersecting) { en.target.classList.add('is-visible'); io.unobserve(en.target); }
  }, { rootMargin: '0px 0px -8% 0px' });
  els.forEach((e) => io.observe(e));
}
</script>
</body>
</html>
