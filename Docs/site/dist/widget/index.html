<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>counter.jet, live</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; align-items: center; justify-content: center;
    background: #0E0E11; color: #F4F3F1;
    font: 15px system-ui, sans-serif;
  }
  .stage { position: relative; width: 160px; height: 100px; }
  .hint { position: absolute; inset: auto 0 -44px 0; text-align: center; font: 12px ui-monospace, monospace; color: #6E6E74; white-space: nowrap; }
  /* height shim for Tower card #2230: web buttons measure 2px high today */
  #jet-app button, #jet-app [role="button"] { appearance: none !important; background: #E8232A !important; color: #fff !important; border: 0 !important; outline: none; border-radius: 999px !important; font: 700 14px system-ui, sans-serif !important; cursor: pointer; height: 36px !important; margin-top: 10px; }
  #jet-app button:hover, #jet-app [role="button"]:hover { background: #FF3B41 !important; }
  #jet-app button:focus-visible { outline: 2px solid #F4F3F1 !important; outline-offset: 2px; }
</style>
</head>
<body>
<div class="stage">
  <div id="jet-app"></div>
  <p class="hint">state, events, and paint: all Jet</p>
</div>
<script type="module">
import { jet_main } from "./app.js";
jet_main();
// The runtime autofocuses the button on mount (noted on Tower card #2230);
// drop that stolen focus so the widget rests quiet inside its iframe.
queueMicrotask(() => document.activeElement?.blur());
</script>
</body>
</html>
